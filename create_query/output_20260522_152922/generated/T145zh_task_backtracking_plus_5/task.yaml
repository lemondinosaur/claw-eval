task_id: T145zh_task_backtracking_plus_5
task_name: 跨部门采购催办与合同签署进度回溯回复草稿
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T145zh_task_backtracking_plus_5/fixtures/gmail/inbox.json
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T145zh_task_backtracking_plus_5/fixtures/todo/tasks.json
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T145zh_task_backtracking_plus_5/fixtures/notes/meetings.json
prompt:
  text: '收件箱里有 5 封邮件，其中 3 封是跨部门采购流程的催办邮件（分别对应合同条款确认/预算审批/供应商回签），另外 2 封是干扰邮件（不带催办标签，且不应被用于回溯）。请你：

    1) 阅读每封催办邮件，提取催办要点与对方要求的时间点；

    2) 在待办事项中定位与该催办对应的采购/合同签署待办，并读取其状态、进度、到期时间及是否存在 blocked_by；

    3) 在会议纪要中找到对应采购/合同签署的讨论记录，提取关键节点（法务校对要点/预算附件缺口与补交窗口/供应商回签响应窗口与风险处理）；

    4) 对每封催办邮件，整理当前采购/合同签署进展、卡点原因（如有）、预计签署完成/回传完成日期，并说明下一步行动及对方需要配合事项；

    5) 最终为 3 封催办邮件分别起草回复草稿（只保存不发送）。'
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
      reply_to_message_id:
        type: string
        description: 回复的原邮件ID
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
- name: todo_list_tasks
  description: 列出待办事项
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(all/pending/in_progress/completed)
    required: []
- name: todo_get_task
  description: 获取待办详情
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办ID
    required:
    - task_id
- name: notes_list
  description: 列出会议纪要
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 最近几天
        default: 30
    required: []
- name: notes_get
  description: 获取会议纪要详情
  input_schema:
    type: object
    properties:
      note_id:
        type: string
        description: 纪要ID
    required:
    - note_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_get_task
  url: http://localhost:9102/todo/tasks/get
  method: POST
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
