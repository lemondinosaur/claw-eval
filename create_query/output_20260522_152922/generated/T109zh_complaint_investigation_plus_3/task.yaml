task_id: T109zh_complaint_investigation_plus_3
task_name: 服务中断计费差错与补偿条款
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
- multi_service
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T109zh_complaint_investigation_plus_3/fixtures/gmail/inbox.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T109zh_complaint_investigation_plus_3/fixtures/contacts/contacts.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T109zh_complaint_investigation_plus_3/fixtures/crm/customers.json
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T109zh_complaint_investigation_plus_3/fixtures/finance/transactions.json
prompt:
  text: '收件箱里有几封客户投诉邮件，需要你逐一调查并给出处理建议，最后为最紧急的案例起草回复邮件草稿并保存。


    请对每封投诉邮件：

    1. 阅读投诉内容，理解客户关于“服务中断后仍被照常计费/补偿未按条款执行”的具体诉求与时间描述。

    2. 在CRM中核实客户归属与付费资质：客户等级（vip/standard）、合同是否有效/是否为付费账号（若客户不存在或标记为未付费需判定为疑似误报）。

    3. 在财务系统中按中断时间窗口核验交易证据：检查是否存在应减免/补偿相关交易（减免/更正/折扣、补偿支出）。重点核验交易状态与审批链路（approved/pending/completed）是否与客户说法一致。

    4. 查找内部对应负责人的联系方式（服务运营/计费支持）。

    5. 给出调查结论与下一步处理建议：若发现“审批有记录但财务仍 pending/缺失支出”，要明确应追到哪个环节并给出可执行的追单建议；若判定为误报（非付费账号/无合同），需要给出澄清与排查建议。


    最紧急案例选择规则：选择客户等级为vip，且投诉涉及补偿仍在pending或存在缺失减免/补偿问题的那一封。对最紧急案例使用 gmail_save_draft
    起草回复邮件草稿（包含：确认中断与计费差错、已核验到的具体交易/状态证据摘要、预计补偿/减免落实时间与内部联系人信息指引）。'
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
      reply_to_message_id:
        type: string
        description: 回复的原邮件ID
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选
      tier:
        type: string
        description: 客户等级筛选(vip/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: finance_list_transactions
  description: 查看交易记录
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 起始日期(YYYY-MM-DD)
      end_date:
        type: string
        description: 截止日期(YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
