prompt:
  text: '请你为“下周二”（根据系统当前日期 2026-03-05 计算出具体日期）这一天入职的3位新员工做分阶段入职协调。要求：


    1）读取HR入职邮件，提取每位员工的岗位/部门需求，并识别是否涉及“合规审查”与“设备缺货/触控板”。

    2）读取知识库，确定需要先“保存草稿后补发最终通知”的触发规则：当出现设备缺货或合规审查尚未完成时，先对有部门经理的部门经理保存草稿；在本次流程规则推定的条件满足后（以本任务内的规则为准，不额外发起澄清流程），补发最终通知。

    3）查通讯录获取每位员工所属部门经理邮箱；若出现“同名歧义”，需用部门匹配选择正确邮箱。

    4）检查日历：入职培训建议时段与日历中“合规例会”覆盖起点附近发生冲突时，选择无冲突的时段创建培训事件。

    5）核对IT库存：重点判断“触控板”是否缺货；如缺货，通知与总结中必须包含“缺货登记/临时备用”和预计到货信息。

    6）对每位员工：向部门经理进行分阶段通信（满足条件则最终发送，否则只保存草稿），并在本次流程中补发（根据规则推定已满足的条件）。

    7）为每位员工创建至少1条入职跟进待办：账号准备/培训/设备或合规进度；缺货与合规相关待办需更高优先级。

    8）输出一份入职安排总结：按员工逐条列出（草稿/发送状态、培训时间与是否调整、设备/合规影响与理由、待办摘要与优先级）。


    请严格按以上规则完成，并确保跨邮件收件人与通讯录部门匹配一致。'
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查看几天的日程
        default: 1
    required:
    - date
- name: calendar_get_user_events
  description: 获取指定用户在指定日期的日程
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户邮箱
      date:
        type: string
        description: 日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参会人邮箱列表
      location:
        type: string
        description: 会议地点
    required:
    - title
    - start_time
    - end_time
    - attendees
- name: todo_list_tasks
  description: 获取待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (pending/in_progress/completed)
      priority:
        type: string
        description: 按优先级筛选 (high/medium/low)
    required: []
- name: todo_create_task
  description: 创建新的待办事项
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 待办标题
      description:
        type: string
        description: 详细描述
      priority:
        type: string
        description: 优先级 (high/medium/low)
      due_date:
        type: string
        description: 截止日期 (YYYY-MM-DD)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - title
- name: todo_update_task
  description: 更新待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办事项ID
      status:
        type: string
        description: 新状态
      priority:
        type: string
        description: 新优先级
      title:
        type: string
        description: 新标题
      description:
        type: string
        description: 新描述
    required:
    - task_id
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: inventory_list_products
  description: 获取库存产品列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
      status:
        type: string
        description: 按库存状态筛选 (normal/out_of_stock/low_stock)
    required: []
- name: inventory_get_product
  description: 获取产品库存详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
