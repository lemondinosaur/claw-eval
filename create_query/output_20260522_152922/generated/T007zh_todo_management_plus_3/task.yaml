task_id: T007zh_todo_management_plus_3
task_name: 跨标签去重（不删）+完成状态约束
version: '1.0'
category: productivity
difficulty: easy
tags:
- general
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T007zh_todo_management_plus_3/fixtures/todo/tasks.json
prompt:
  text: 请帮我整理待办：识别并合并真正重复的事项（用标记完成的方式合并，不要删除任何待办项）。若仅标题相同但 tags 指向不同模块、或描述语义不同（看起来像但其实不同），则不要合并，并在输出中说明未合并原因。对过期的
    pending 任务进行标记（只标记 pending 且 due_date 非空且早于 2026-06-01 的任务），最终给出：1）哪些任务被合并并标记为
    completed 的清单与原因；2）未合并项与原因（必须提到“看起来像但其实不同”）；3）过期 pending 的分组列表，并确认未执行删除操作。
  language: zh
tools:
- name: todo_list_tasks
  description: 获取所有待办事项
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (pending/completed/all)
        default: all
    required: []
- name: todo_update_task
  description: 更新待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 任务ID
      title:
        type: string
        description: 新标题
      priority:
        type: string
        description: 优先级 (high/medium/low)
      status:
        type: string
        description: 状态 (pending/completed)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - task_id
- name: todo_create_task
  description: 创建新的待办事项
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 任务标题
      description:
        type: string
        description: 任务描述
      priority:
        type: string
        description: 优先级
      due_date:
        type: string
        description: 截止日期 (YYYY-MM-DD)
    required:
    - title
- name: todo_delete_task
  description: 永久删除待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 任务ID
    required:
    - task_id
tool_endpoints:
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_update_task
  url: http://localhost:9102/todo/tasks/update
  method: POST
- tool_name: todo_create_task
  url: http://localhost:9102/todo/tasks/create
  method: POST
- tool_name: todo_delete_task
  url: http://localhost:9102/todo/tasks/delete
  method: POST
sandbox_files:
- fixtures/todo/tasks.json
environment:
  timeout_seconds: 300
  max_turns: 25
