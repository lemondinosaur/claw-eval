task_id: T093_pinbench_email_triage_report_plus_3
task_name: HR Deadline + Incident Merge
version: '1.0'
category: organization
difficulty: easy
tags:
- general
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T093_pinbench_email_triage_report_plus_3/fixtures/gmail/inbox.json
prompt:
  text: '请完成一次邮箱分诊报告（使用 Gmail：先列出收件箱消息，再对与生产事件相关的邮件进行核对）。


    要求：

    1) 读取所有邮件，并对每封相关邮件输出：

    - Priority: P0 到 P4

    - Category

    - Recommended action

    2) 报告顶部写“最紧急事项摘要”（只包含最需要立即处理的生产与截止相关项），并给出“今天的处理计划”（按优先级从高到低）。

    3) 必须区分真正的生产事件（例如值班渠道、错误率/影响线上、明确时间窗）与误导性但实际为内部演练/复盘/桌面演练（即使同样包含 incident 相关措辞），避免把演练复盘当作生产事故。

    4) HR / 合规 / 财务类邮件需要根据“是否需要提交/确认、截止是否临近”来调整优先级；订阅周报、促销、开源社区公告等一般通知不要误判为事故。


    不要发送邮件。'
  language: en
tools:
- name: gmail_list_messages
  description: List inbox messages
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        default: 30
      max_results:
        type: integer
        default: 20
    required: []
- name: gmail_get_message
  description: Get one message
  input_schema:
    type: object
    properties:
      message_id:
        type: string
    required:
    - message_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
sandbox_files:
- fixtures/gmail/inbox.json
environment:
  timeout_seconds: 300
  max_turns: 18
