prompt:
  text: "处理收件箱中“隐含费用条款触发升级”的邮件。请从正文中识别并提取“实际需要承诺/等效赔付”的金额口径（例如：违约金豁免合计、服务费减免/抵扣金额等价于赔付；若出现“USD\
    \ 30k等值/已按汇率换算为CNY”等信息，以正文给出的等值金额为准）。\n\n按如下规则处理：\n1）读取并解析收件箱所有升级邮件（共9封）。\n2）对每封邮件：\n\
    \   - 先解析“合同编号”和“条款名称”（用于在Helpdesk里按“合同编号+条款名称”匹配最相关工单）。\n   - 从CRM获取该客户的annual_revenue、status与tier。\n\
    3）规则分流（动作类型与工单更新必须一致）：\n   - 若正文显示金额为“待确认/另行核算”：仅更新工单状态为“待核算”，并打tag含“待核算”；不发送邮件、不保存承诺草稿。\n\
    \   - 若status=churned或正文含“已终止/不续约”：通知法务并在工单打tag“异常-条款触发”。\n   - 否则：计算等效赔付金额 /\
    \ annual_revenue 的阈值比率。若<=5%：发送“处理通知”给客户服务联络人；若>5%：仅保存草稿“需上级审批”。\n   - 若客户tier为vip：在不改变阈值规则的前提下，将工单priority提升（如standard->medium/low，vip->high/critical）。\n\
    4）最终输出一份清晰摘要：对每封邮件给出“等效赔付金额口径依据（来自哪种隐含费用条款表达）”、提取金额、阈值比率、是否待核算/异常、以及动作类型（发送处理通知/保存草稿需上级审批/仅待核算/异常通知法务）。\n\
    \n若邮件缺失客户编号或合同编号等关键匹配信息，则跳过该邮件并在摘要中标注“跳过：关键信息缺失”。"
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: helpdesk_list_tickets
  description: 获取工单列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (open/closed/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详细信息
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单信息
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级 (low/medium/high/critical)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: crm_list_customers
  description: 获取客户列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (active/churned)
      tier:
        type: string
        description: 按等级筛选 (vip/standard)
      industry:
        type: string
        description: 按行业筛选
    required: []
- name: crm_get_customer
  description: 获取客户详细信息
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: finance_list_transactions
  description: 获取财务交易记录列表
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      end_date:
        type: string
        description: 结束日期 (YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取财务交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
