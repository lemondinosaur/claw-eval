task_id: T035zh_vendor_procurement_plus_5
task_name: 预算压缩下的供应商去风险决策
version: '1.0'
category: procurement
difficulty: hard
tags:
- general
services:
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_5/fixtures/finance/transactions.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_5/fixtures/kb/articles.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_5/fixtures/inventory/products.json
- name: rss
  command: python mock_services/rss/server.py
  port: 9109
  health_check: http://localhost:9109/rss/articles
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9109/rss/reset
  env:
    RSS_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_5/fixtures/rss/articles.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_5/fixtures/crm/customers.json
prompt:
  text: '由于财务预算比上周期大幅压缩，我们必须在“库存缺口仍存在、但预算紧张”的约束下重新评估服务器供应商，并输出一份供应商评估报告与采购建议（只做评估分析，不要下单、不要联系供应商）。


    要求：

    1）结合库存缺口判断：在预算明显压缩的情况下，先计算“必须采购的最小组合”（给出清单与理由），再把采购规模控制在可承受范围内；

    2）从RSS找出供应商的履约/服务连续性风险：至少识别2家供应商的“融资压力/服务能力削减/渠道政策变更/交付延迟”等风险，并说明这些风险与履约能力的关联；同时处理“表面利好
    vs 负面风险”的矛盾对照解释（至少2家）；

    3）从CRM读取供应商信用/合作稳定性信号：至少对2家供应商提取notes里与“被暂停供应/整改材料/质保争议/被拒单/近期恢复”等相关线索，用于去风险决策；

    4）从知识库抓取供应商评估规则与审批门槛：明确集中度上限与审批层级规则，并说明“当采购金额超过预算一定比例时需要额外说明”的触发条件与应对建议；

    5）从财务系统核对压缩预算下的可承受金额：读取压缩预算/冻结/拨付延后等线索以及历史支出影响，计算在集中度上限内如何在主供应商与备选供应商之间分配份额。


    输出必须包含：最小组合清单、集中度控制策略、矛盾处理解释、信用/履约风险去风险措施、预算/审批结论（例如是否触发更高审批层级、建议如何分阶段/试点采购与锁定资源）。'
  language: zh
tools:
- name: inventory_list_products
  description: 获取商品库存列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按类别筛选
    required: []
- name: inventory_get_product
  description: 获取单个商品的详细库存信息
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 商品ID
    required:
    - product_id
- name: rss_list_articles
  description: 获取文章列表
  input_schema:
    type: object
    properties:
      source:
        type: string
        description: 按来源筛选
      category:
        type: string
        description: 按类别筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: rss_get_article
  description: 获取文章完整内容
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: crm_list_customers
  description: 获取CRM客户列表，可按状态、等级、行业筛选
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选：active, inactive, churned
      tier:
        type: string
        description: 客户等级筛选：vip, standard
      industry:
        type: string
        description: 按行业筛选
    required: []
- name: crm_get_customer
  description: 获取单个客户的完整详细信息
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: finance_list_transactions
  description: 获取费用交易记录列表
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      end_date:
        type: string
        description: 结束日期 (YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取单笔交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
- name: finance_report_submit
  description: 提交财务报告
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 报告标题
      content:
        type: string
        description: 报告内容
      total_amount:
        type: number
        description: 总金额
      report_type:
        type: string
        description: 报告类型：expense, procurement, budget
    required:
    - title
    - content
tool_endpoints:
- tool_name: inventory_list_products
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_product
  url: http://localhost:9108/inventory/products/get
  method: POST
- tool_name: rss_list_articles
  url: http://localhost:9109/rss/articles
  method: POST
- tool_name: rss_get_article
  url: http://localhost:9109/rss/articles/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
- tool_name: finance_report_submit
  url: http://localhost:9104/finance/report/submit
  method: POST
sandbox_files:
- fixtures/inventory/products.json
- fixtures/rss/articles.json
- fixtures/crm/customers.json
- fixtures/kb/articles.json
- fixtures/finance/transactions.json
environment:
  timeout_seconds: 900
  max_turns: 40
