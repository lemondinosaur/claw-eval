task_id: T035zh_vendor_procurement_plus_3
task_name: 信创合规替代链路评审
version: '1.0'
category: procurement
difficulty: hard
tags:
- general
services:
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_3/fixtures/finance/transactions.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_3/fixtures/kb/articles.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_3/fixtures/inventory/products.json
- name: rss
  command: python mock_services/rss/server.py
  port: 9109
  health_check: http://localhost:9109/rss/articles
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9109/rss/reset
  env:
    RSS_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_3/fixtures/rss/articles.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_3/fixtures/crm/customers.json
prompt:
  text: '企业正在进行信创合规服务器替代评估。请你输出《供应商评估报告+不下单的采购建议》。


    要求：

    1) 必须以“信创合规/兼容性”为第一优先约束（硬约束或强加权），并重点评估：兼容性风险、交付链路风险与历史稳定性。

    2) 仅依据信息源完成评审：

    - KB：提取信创合规优先、兼容性验证与评估要点（用于指导评分卡与结论）；

    - 库存：锁定国产替代关键机型缺口、现有lead_time对替换节奏的影响；

    - RSS：抓取‘认证通过/政策加速’等正面证据，并同时抓取与供应商/供货链相关的‘返修/返货/交付延期/供应链不稳’负面证据；

    - CRM：提取合作历史与notes中的落地/处理经验；若notes存在“返修补偿不足/交付延期/逾期”等负面细节，必须指出其与“认证优先/品牌背书/正面新闻”之间的矛盾，并在报告中调整评分与建议。

    - 财务：核对退货退款对净可用预算的影响，并据此支撑你的结论（可以触发“保守口径预算不足”的判断，但不要提交审批单）。

    3) 输出至少两家供应商的评分卡结果，并给出采购路径建议（例如：先小批试点验证兼容性→再放量的分阶段策略）。

    4) 禁止联系供应商；禁止下单；禁止提交采购/财务报告（不得调用 finance_report_submit）。


    请确保每一条关键结论都能对应到具体数据/条款/文章/交易记录中的信息点，并明确说明你如何处理“正面认证优先 vs 交付/返修风险”的矛盾。'
  language: zh
tools:
- name: inventory_list_products
  description: 获取商品库存列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按类别筛选
    required: []
- name: inventory_get_product
  description: 获取单个商品的详细库存信息
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 商品ID
    required:
    - product_id
- name: rss_list_articles
  description: 获取文章列表
  input_schema:
    type: object
    properties:
      source:
        type: string
        description: 按来源筛选
      category:
        type: string
        description: 按类别筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: rss_get_article
  description: 获取文章完整内容
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: crm_list_customers
  description: 获取CRM客户列表，可按状态、等级、行业筛选
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选：active, inactive, churned
      tier:
        type: string
        description: 客户等级筛选：vip, standard
      industry:
        type: string
        description: 按行业筛选
    required: []
- name: crm_get_customer
  description: 获取单个客户的完整详细信息
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: finance_list_transactions
  description: 获取费用交易记录列表
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      end_date:
        type: string
        description: 结束日期 (YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取单笔交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
- name: finance_report_submit
  description: 提交财务报告
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 报告标题
      content:
        type: string
        description: 报告内容
      total_amount:
        type: number
        description: 总金额
      report_type:
        type: string
        description: 报告类型：expense, procurement, budget
    required:
    - title
    - content
tool_endpoints:
- tool_name: inventory_list_products
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_product
  url: http://localhost:9108/inventory/products/get
  method: POST
- tool_name: rss_list_articles
  url: http://localhost:9109/rss/articles
  method: POST
- tool_name: rss_get_article
  url: http://localhost:9109/rss/articles/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
- tool_name: finance_report_submit
  url: http://localhost:9104/finance/report/submit
  method: POST
sandbox_files:
- fixtures/inventory/products.json
- fixtures/rss/articles.json
- fixtures/crm/customers.json
- fixtures/kb/articles.json
- fixtures/finance/transactions.json
environment:
  timeout_seconds: 900
  max_turns: 40
