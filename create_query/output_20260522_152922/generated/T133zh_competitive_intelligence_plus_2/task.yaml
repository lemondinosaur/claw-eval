task_id: T133zh_competitive_intelligence_plus_2
task_name: Channel & Pricing Intel
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: rss
  command: python mock_services/rss/server.py
  port: 9109
  health_check: http://localhost:9109/rss/articles
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9109/rss/reset
  env:
    RSS_FIXTURES: create_query/output_20260522_152922/generated/T133zh_competitive_intelligence_plus_2/fixtures/rss/feeds.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T133zh_competitive_intelligence_plus_2/fixtures/kb/articles.json
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T133zh_competitive_intelligence_plus_2/fixtures/gmail/inbox.json
prompt:
  text: "请生成竞品情报报告供市场负责人参考（不要发送邮件）：\n\n1）先读取收件箱邮件，提取这次要对外谈判的定价争议点与客户画像（渠道偏好、敏感点、需要强调的价值主张、需要回避的坑）。\n\
    2）再使用RSS抓取竞品A与竞品B在“渠道合作/经销商/返佣/折扣、套餐/捆绑、定价策略/试用政策/价格调整”方面的最新文章；只保留明确与竞品A/竞品B相关、且与上述主题直接相关的内容。\n\
    3）在知识库中检索我们对两家渠道与定价策略的既有分析；找出哪些旧判断已被RSS新信息推翻或需要修正，并明确“旧结论→新信息→修正原因”。\n4）整合输出报告，固定包含三部分：\n\
    \   - 竞品A渠道+定价动态分析（机制变化、对客户成本结构的影响、可用于谈判的要点）\n   - 竞品B渠道+捆绑动态分析（套餐/模块订阅/可能的隐藏成本或结算方式、对比我司透明选配的切入点）\n\
    \   - 对我司的谈判影响与建议（含话术要点：强调透明、成本可解释、替代方案与谈判筹码）。\n5）最后准备并保存邮件草稿：收件人固定为 marketing_lead@ourcompany.com；邮件主题必须包含“渠道与定价”三个字；保存草稿不要发送。\n\
    \n输出中文报告正文，并在报告末尾单独列出“邮件草稿要点清单”（供正文组织）。"
  language: zh
tools:
- name: rss_list_articles
  description: 获取RSS文章列表
  input_schema:
    type: object
    properties:
      feed_name:
        type: string
        description: 按RSS源筛选
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: rss_get_article
  description: 获取文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章全文
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
tool_endpoints:
- tool_name: rss_list_articles
  url: http://localhost:9109/rss/articles
  method: POST
- tool_name: rss_get_article
  url: http://localhost:9109/rss/articles/get
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
