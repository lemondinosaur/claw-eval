task_id: T029zh_cross_service_meeting_plus_2
task_name: 技术评审会（部分缺失联系人容错）
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T029zh_cross_service_meeting_plus_2/fixtures/gmail/inbox.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T029zh_cross_service_meeting_plus_2/fixtures/contacts/contacts.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T029zh_cross_service_meeting_plus_2/fixtures/calendar/events.json
prompt:
  text: '请处理收件箱中一封来自“北极星软件”客户成功经理发来的“架构评审会议”邀请：

    - 邮件提到参会人含我方“何晴”（部门写为平台架构组）以及“郑岩”（只给了英文姓氏：ZHENG），还提到对方“客户成功经理（姓名可能省略）”。

    你的任务：

    1）读取邮件，提取会议主题与会期窗口（会议时长2小时，主窗口为 2026-03-07 周六 10:00-14:00）；

    2）在通讯录里尽可能通过姓名/部门/英文姓氏进行检索，确保至少找到我方两位的邮箱；若对方联系人未能在通讯录中唯一匹配，请从邮件头信息推断其邮箱并用于发信（不需要额外联系人工工具时也要能完成）；

    3）查询所有确定参会者在该窗口内的空闲，选择共同可用的最早2小时；

    4）在日历创建会议（地点为“线上会议（Teams）”；若邮件要求含“会议室C或线上（二选一）”，以邮件要求为准），并确保会议标题为“架构评审会议”；

    5）保存并发送回复确认给邮件发起方，正文包含：选定的日期时间、会议主题、地点、参会人（列出你找到的姓名与邮箱）。'
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查看几天的日程
        default: 1
    required:
    - date
- name: calendar_get_user_events
  description: 获取指定用户在指定日期的日程
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户邮箱
      date:
        type: string
        description: 日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参会人邮箱列表
      location:
        type: string
        description: 会议地点
    required:
    - title
    - start_time
    - end_time
    - attendees
- name: calendar_delete_event
  description: 删除日历事件
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_user_events
  url: http://localhost:9101/calendar/user_events
  method: POST
- tool_name: calendar_create_event
  url: http://localhost:9101/calendar/events/create
  method: POST
- tool_name: calendar_delete_event
  url: http://localhost:9101/calendar/events/delete
  method: POST
sandbox_files:
- fixtures/gmail/inbox.json
- fixtures/contacts/contacts.json
- fixtures/calendar/events.json
environment:
  mock_today: '2026-03-03'
  timeout_seconds: 600
  max_turns: 30
