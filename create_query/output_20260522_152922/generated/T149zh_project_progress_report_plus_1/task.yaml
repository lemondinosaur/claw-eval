task_id: T149zh_project_progress_report_plus_1
task_name: 多团队周报汇总
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
- multi_service
services:
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_1/fixtures/calendar/events.json
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_1/fixtures/notes/meetings.json
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_1/fixtures/todo/tasks.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_1/fixtures/contacts/contacts.json
prompt:
  text: '请为3个并行项目（Orchid/Cobalt/Ruby）生成“本周进度汇报”（当前日期：2026-05-10，按该日期所在周统计）。


    要求：

    1) 查找各项目本周相关会议，概述会议结论；

    2) 阅读与项目相关的会议纪要，提取每条行动项的责任人、到期日与当前状态（completed/in_progress/pending/blocked 等）；

    3) 读取待办任务（pending/in_progress/completed），按项目计算完成率=completed数/总数，并识别逾期（due_date
    < 2026-05-10）、blocked（给出blocked_by阻塞来源说明）；

    4) 检查“日历关键交付评审存在但纪要缺失”的情况，并将其作为关键风险点明；

    5) 检查“待办事项与纪要行动项未完全对应”的情况（需要指出缺失对应的那一项）；

    6) 为每个项目输出主要负责人邮箱与电话。


    最终输出三份并列报告：每份包含会议概述、行动项状态列表、完成率、关键风险（逾期/blocked/缺纪要/行动项不匹配）、以及主要负责人联系方式。'
  language: zh
tools:
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
- name: notes_list
  description: 列出会议纪要
  input_schema:
    type: object
    properties:
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: notes_get
  description: 获取纪要详情
  input_schema:
    type: object
    properties:
      note_id:
        type: string
        description: 纪要ID
    required:
    - note_id
- name: todo_list_tasks
  description: 查看待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(pending/completed/all)
        default: all
    required: []
- name: todo_get_task
  description: 获取待办详情
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办ID
    required:
    - task_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
tool_endpoints:
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_get_task
  url: http://localhost:9102/todo/tasks/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
environment:
  mock_today: '2026-03-24'
  timeout_seconds: 600
  max_turns: 35
