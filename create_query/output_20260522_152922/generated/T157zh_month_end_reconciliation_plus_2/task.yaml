task_id: T157zh_month_end_reconciliation_plus_2
task_name: 多币种税费口径对账
version: '1.0'
category: ops
difficulty: hard
tags:
- general
- multi_service
services:
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_2/fixtures/finance/transactions.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_2/fixtures/crm/customers.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_2/fixtures/config/integrations.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_2/fixtures/inventory/items.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_2/fixtures/scheduler/jobs.json
prompt:
  text: '请进行本月“多币种税费口径”对账：

    1）检查月末前后自动化任务的执行状态（尤其与汇兑/税务同步相关的），定位任何延迟/失败的时间窗；

    2）检查支付、发票与税务相关集成配置是否处于 active 或存在降级（degraded/partial_error），重点核对发票含税/不含税标记切换与税费映射；

    3）从财务系统拉取本月交易，按币种与税费/汇兑字段核算“净应收”（将“客户付款/服务收入”扣除“税费扣除/税金”并纳入“汇兑调整”，形成同一口径下的净额），与CRM中
    contract_amount/expected_monthly（以CNY口径）比对；

    4）核对采购与库存：检查某类进口设备的采购支出是否因汇兑调整造成库存成本差额，判断差异来自“汇兑口径”还是“入库/成本记录错误”；

    5）输出对账报告：对每个客户与相关产品，明确分类为“口径差异”或“疑似真实短收/需人工查账”，并给出证据链与下一步核对清单（应指出要查的job/config/字段）。'
  language: zh
tools:
- name: finance_list_transactions
  description: 查看财务交易记录
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 起始日期(YYYY-MM-DD)
      end_date:
        type: string
        description: 截止日期(YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
- name: crm_list_customers
  description: 查看客户列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(active/inactive/churned)
      tier:
        type: string
        description: 按等级筛选(VIP/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: config_list_integrations
  description: 查看所有系统集成配置
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(active/error/degraded)
    required: []
- name: config_get_integration
  description: 获取集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成ID
    required:
    - integration_id
- name: inventory_list_products
  description: 查看库存产品列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
    required: []
- name: inventory_get_product
  description: 获取库存产品详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
- name: scheduler_list_jobs
  description: 列出所有定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按最近运行状态筛选(success/failed)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情（含执行历史）
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: scheduler_job_history
  description: 查看定时任务执行历史
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
      limit:
        type: integer
        description: 返回条数
        default: 10
    required:
    - job_id
tool_endpoints:
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
- tool_name: inventory_list_products
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_product
  url: http://localhost:9108/inventory/products/get
  method: POST
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: scheduler_job_history
  url: http://localhost:9112/scheduler/jobs/history
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
