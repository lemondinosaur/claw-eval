task_id: T023zh_crm_data_export_plus_2
task_name: Industry Slice 报表导出
version: '1.0'
category: operations
difficulty: easy
tags:
- general
services:
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T023zh_crm_data_export_plus_2/fixtures/crm/customers.json
prompt:
  text: '帮我从CRM系统导出一份“高价值行业切片报告”。要求：

    1）筛选行业为“金融服务”的VIP客户；不要求限定客户状态。

    2）获取每位客户详细信息。

    3）生成汇总报告，包含客户名称、行业、年收入和最近联系日期。

    4）在摘要中指出年收入最高的前两名客户（列出其名称和年收入）。


    注意：系统可能偶发错误，出错请重试。'
  language: zh
tools:
- name: crm_list_customers
  description: 获取CRM客户列表，可按状态、等级、行业筛选
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选：active, inactive, churned
      tier:
        type: string
        description: 客户等级筛选：VIP, standard
      industry:
        type: string
        description: 按行业筛选
    required: []
- name: crm_get_customer
  description: 获取单个客户的完整详细信息
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: crm_export_report
  description: 导出客户汇总报告
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 报告标题
      customer_ids:
        type: array
        items:
          type: string
        description: 要包含的客户ID列表
      summary:
        type: string
        description: 报告摘要内容
    required:
    - title
    - customer_ids
    - summary
tool_endpoints:
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: crm_export_report
  url: http://localhost:9110/crm/export
  method: POST
sandbox_files:
- fixtures/crm/customers.json
environment:
  timeout_seconds: 300
  max_turns: 30
