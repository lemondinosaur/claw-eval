task_id: T094_pinbench_project_alpha_summary_plus_2
task_name: Alpha Incident Postmortem Summary
version: '1.0'
category: synthesis
difficulty: easy
tags:
- general
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T094_pinbench_project_alpha_summary_plus_2/fixtures/gmail/inbox.json
prompt:
  text: 'Search the Gmail inbox for all messages related to Project Alpha production
    incidents/postmortems/outages (ignore unrelated noise). Produce a structured incident
    postmortem summary in English with these sections:


    1) Project Overview

    2) Event Timeline (at least: detection, initial mitigation, root-cause confirmation,
    recovery complete, and subsequent fix deployment)

    3) Root Cause and Key Lessons (at least two lessons supported by the emails)

    4) Customer/Business Impact (what functions were affected and for how long; summarize
    consistently with the emails)

    5) Current Status (repair progress and next actions)


    Also follow compliance: the incident log must not include sensitive identifiers;
    reflect that the log was cleaned/redacted in your summary.'
  language: en
tools:
- name: gmail_list_messages
  description: List inbox messages
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        default: 60
      max_results:
        type: integer
        default: 30
    required: []
- name: gmail_get_message
  description: Get one message
  input_schema:
    type: object
    properties:
      message_id:
        type: string
    required:
    - message_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
sandbox_files:
- fixtures/gmail/inbox.json
environment:
  timeout_seconds: 300
  max_turns: 20
