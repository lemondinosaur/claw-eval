task_id: T013zh_meeting_notes_plus_3
task_name: 跨部门同步纪要行动项
version: '1.0'
category: productivity
difficulty: easy
tags:
- general
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T013zh_meeting_notes_plus_3/fixtures/notes/meetings.json
prompt:
  text: 请帮我把“跨部门同步会”的要点和行动项按业务/技术两类整理，提炼出每条行动项的负责人、要做什么、截止时间/下次同步点或依赖说明（阻塞项需明确“依赖方：XX（阻塞）”并说明未完成状态；缺失负责人需从上下文推断），最后把会议纪要分享给所有跨部门参会人。
  language: zh
tools:
- name: notes_list
  description: 获取会议记录列表
  input_schema:
    type: object
    properties:
      max_results:
        type: integer
        description: 最大返回数量
        default: 10
    required: []
- name: notes_get
  description: 根据ID获取会议记录详细内容
  input_schema:
    type: object
    properties:
      note_id:
        type: string
        description: 会议记录ID
    required:
    - note_id
- name: notes_share
  description: 将会议记录分享给其他人
  input_schema:
    type: object
    properties:
      note_id:
        type: string
        description: 会议记录ID
      recipients:
        type: array
        items:
          type: string
        description: 接收人列表
    required:
    - note_id
    - recipients
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
- tool_name: notes_share
  url: http://localhost:9105/notes/share
  method: POST
sandbox_files:
- fixtures/notes/meetings.json
environment:
  timeout_seconds: 300
  max_turns: 20
