task_id: T007zh_todo_management_plus_4
task_name: 多时区式截点（边界）去重+过期
version: '1.0'
category: productivity
difficulty: easy
tags:
- general
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T007zh_todo_management_plus_4/fixtures/todo/tasks.json
prompt:
  text: 帮我把待办整理一下：先识别重复项并将重复项标记为 completed（不要删除任何待办项，也不要影响非重复项状态）；再把“过期”的 pending
    待办标出来：仅当 due_date 严格小于今天（2026-07-20）才算过期。注意 due_date 恰好等于今天的不能算过期；due_date 为 null
    的也不算过期。completed 的待办不要再按“过期待办”处理。最后输出重复合并说明，并分别列出过期与未过期（含今天）的任务。
  language: zh
tools:
- name: todo_list_tasks
  description: 获取所有待办事项
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (pending/completed/all)
        default: all
    required: []
- name: todo_update_task
  description: 更新待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 任务ID
      title:
        type: string
        description: 新标题
      priority:
        type: string
        description: 优先级 (high/medium/low)
      status:
        type: string
        description: 状态 (pending/completed)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - task_id
- name: todo_create_task
  description: 创建新的待办事项
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 任务标题
      description:
        type: string
        description: 任务描述
      priority:
        type: string
        description: 优先级
      due_date:
        type: string
        description: 截止日期 (YYYY-MM-DD)
    required:
    - title
- name: todo_delete_task
  description: 永久删除待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 任务ID
    required:
    - task_id
tool_endpoints:
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_update_task
  url: http://localhost:9102/todo/tasks/update
  method: POST
- tool_name: todo_create_task
  url: http://localhost:9102/todo/tasks/create
  method: POST
- tool_name: todo_delete_task
  url: http://localhost:9102/todo/tasks/delete
  method: POST
sandbox_files:
- fixtures/todo/tasks.json
environment:
  timeout_seconds: 300
  max_turns: 25
