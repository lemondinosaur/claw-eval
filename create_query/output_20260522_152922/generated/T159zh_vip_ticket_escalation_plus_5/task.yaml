task_id: T159zh_vip_ticket_escalation_plus_5
task_name: VIP多工单合并升级与并行草稿
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
- multi_service
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_5/fixtures/helpdesk/tickets.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_5/fixtures/crm/customers.json
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_5/fixtures/gmail/inbox.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_5/fixtures/contacts/contacts.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_5/fixtures/kb/articles.json
prompt:
  text: "有同一VIP客户提交了多张紧急工单（同一customer_id下包含critical与其他紧急告警）。请完成升级与邮件草稿生成流程：\n\n1）使用helpdesk_list_tickets找出该VIP客户的所有open紧急工单，并列出清单；在其中识别最需要优先升级的一张critical工单。\n\
    2）对最critical工单使用helpdesk_get_ticket获取关键详情，提取影响点与严重性（例如：搜索服务错误率升高/搜索不可用、影响运营活动等）。\n\
    3）使用crm_get_customer确认该VIP客户SLA（重点引用其中的“1小时响应/4小时解决”等承诺到邮件中）。\n4）读取该VIP客户来信：使用gmail_list_messages+gmail_get_message定位到来自该VIP客户业务负责人的那封邮件，并提取其明确要求（优先修复路径、预计窗口、并行处理其他紧急问题的同步说明）。\n\
    5）使用kb_search（以“搜索错误率/错误率升高/服务降级/应急回滚/降级”等关键词）找到最匹配的KB文章，再用kb_get_article获取全文并用于应急要点摘要。\n\
    6）使用contacts_search定位搜索/后端技术负责人、以及升级接收人与客户对接人，然后据此完成升级分配信息。\n7）保存两封邮件草稿（仅保存不发送）：\n\
    \   - 客户确认回复草稿：明确说明已识别到同客户的其他紧急工单并正并行推进，但本封邮件聚焦最紧急那张critical工单；给出优先修复路径与预计恢复窗口；引用VIP\
    \ SLA节点。\n   - 内部升级通知草稿：说明critical工单严重性、分配执行人/升级接收点；总结KB应急要点；简述并行其他紧急工单的状态与SLA节点。\n\
    \n最终：不得关闭工单、不得发送邮件；只保存两封草稿。"
  language: zh
tools:
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分配）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      assigned_to:
        type: string
        description: 分配给谁
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选
      tier:
        type: string
        description: 客户等级筛选(vip/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章全文
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
      reply_to_message_id:
        type: string
        description: 回复的原邮件ID
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
