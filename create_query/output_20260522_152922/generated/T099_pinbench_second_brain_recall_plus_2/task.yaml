task_id: T099_pinbench_second_brain_recall_plus_2
task_name: 'Second Brain: Research Milestones'
version: '1.0'
category: memory
difficulty: easy
tags:
- general
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T099_pinbench_second_brain_recall_plus_2/fixtures/notes/memory.json
prompt:
  text: 'Treat the notes service as my persisted second brain. Find the stored research
    milestones memory note and answer:


    1) What research direction am I focused on?

    2) What date did the key breakthrough happen? (format as day/month/year)

    3) Who is my collaborator and what organization are they with?

    4) What is the research project called and what is its main approach?

    5) What is the internal visit code phrase my team uses?'
  language: en
tools:
- name: notes_list
  description: List notes
  input_schema:
    type: object
    properties:
      max_results:
        type: integer
        default: 10
    required: []
- name: notes_get
  description: Get one note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
sandbox_files:
- fixtures/notes/memory.json
environment:
  timeout_seconds: 180
  max_turns: 8
