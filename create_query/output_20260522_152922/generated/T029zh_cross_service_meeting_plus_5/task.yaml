task_id: T029zh_cross_service_meeting_plus_5
task_name: 多方同步会（人数5且存在碎片化可用时段）
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T029zh_cross_service_meeting_plus_5/fixtures/gmail/inbox.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T029zh_cross_service_meeting_plus_5/fixtures/contacts/contacts.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T029zh_cross_service_meeting_plus_5/fixtures/calendar/events.json
prompt:
  text: "请处理我邮箱里来自“Helios Systems”的多方同步会邀请邮件。\n\n要求：\n1）阅读邮件获取会议主题《跨团队里程碑对齐》、时长2小时，以及偏好策略：优先上午（09:00-12:00）；若上午找不到共同可用连续2小时，则改用下午（13:30-17:30）。\n\
    2）通讯录中为以下5位参会人各自查找邮箱：林澜、邱博、白薇、蒋晨、顾然（邮件给出姓名但不含邮箱）。\n3）对这5人在指定日期 2026-03-12（周四）的日程分别查询，找出所有人都有空的“连续2小时”。\n\
    \   - 需先在上午区寻找；若上午不存在共同的连续2小时，则在下午区寻找。\n   - 选择“所有人共同最早”的可行时段；并遵循上午优先/下午兜底策略。\n\
    4）创建日历事件：参会人包含全部5位（attendees 为5个邮箱），地点为“会议室E”，事件主题与邮件一致。\n5）给Helios Systems发送确认邮件（先保存草稿再发送）。邮件正文需包含：最终选定时段（含日期与开始/结束时间）以及5位参会人姓名列表。\n\
    \n目标情况下应选在 2026-03-12 下午的最早共同可用连续2小时：15:30-17:30。"
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查看几天的日程
        default: 1
    required:
    - date
- name: calendar_get_user_events
  description: 获取指定用户在指定日期的日程
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户邮箱
      date:
        type: string
        description: 日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参会人邮箱列表
      location:
        type: string
        description: 会议地点
    required:
    - title
    - start_time
    - end_time
    - attendees
- name: calendar_delete_event
  description: 删除日历事件
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_user_events
  url: http://localhost:9101/calendar/user_events
  method: POST
- tool_name: calendar_create_event
  url: http://localhost:9101/calendar/events/create
  method: POST
- tool_name: calendar_delete_event
  url: http://localhost:9101/calendar/events/delete
  method: POST
sandbox_files:
- fixtures/gmail/inbox.json
- fixtures/contacts/contacts.json
- fixtures/calendar/events.json
environment:
  mock_today: '2026-03-03'
  timeout_seconds: 600
  max_turns: 30
