task_id: T099_pinbench_second_brain_recall_plus_4
task_name: 'Second Brain: Learning Path Summary'
version: '1.0'
category: memory
difficulty: easy
tags:
- general
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T099_pinbench_second_brain_recall_plus_4/fixtures/notes/memory.json
prompt:
  text: '把 notes 服务当作持久化的第二大脑。找到名为 “learning path summary” 的学习路径总结笔记，并回答：


    1) 学习路径的主题是什么？

    2) 你具体在什么时候开始学习它（精确到月份）？

    3) 你推荐了哪本书以及作者是谁？

    4) 该学习路径绑定在什么项目上，以及目标用户是谁？

    5) 团队通行卡片上的口令短语是什么？'
  language: en
tools:
- name: notes_list
  description: List notes
  input_schema:
    type: object
    properties:
      max_results:
        type: integer
        default: 10
    required: []
- name: notes_get
  description: Get one note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
sandbox_files:
- fixtures/notes/memory.json
environment:
  timeout_seconds: 180
  max_turns: 8
