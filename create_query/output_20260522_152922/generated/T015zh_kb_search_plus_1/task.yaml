task_id: T015zh_kb_search_plus_1
task_name: 远程协作故障排查
version: '1.0'
category: knowledge
difficulty: easy
tags:
- general
services:
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T015zh_kb_search_plus_1/fixtures/kb/articles.json
prompt:
  text: 我在家远程工作：企业文档同步失败、视频会议偶发卡顿并掉帧。请根据知识库给出“先自检后联系IT”的分步骤排查与处理流程：需要包含VPN与网络前置条件、协作文档权限检查（例如Confluence空间提示权限不足该怎么查）、以及针对视频会议卡顿的处理建议与备用方案（例如调整会议模式/语音优先、网络占用排查、必要时的替代沟通方式）。请明确指出你从哪些文章来源（文章标题或文章ID）提炼了要点。注意：企业微信能正常登录，但仍需优先确认VPN连接状态与网络环境要求。
  language: zh
tools:
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按类别筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: kb_update_article
  description: 更新知识库文章内容
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
      content:
        type: string
        description: 更新后的内容
    required:
    - article_id
    - content
tool_endpoints:
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: kb_update_article
  url: http://localhost:9106/kb/articles/update
  method: POST
sandbox_files:
- fixtures/kb/articles.json
environment:
  timeout_seconds: 300
  max_turns: 25
