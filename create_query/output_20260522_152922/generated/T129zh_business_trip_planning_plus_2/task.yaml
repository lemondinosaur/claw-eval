task_id: T129zh_business_trip_planning_plus_2
task_name: 跨区售后巡检
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T129zh_business_trip_planning_plus_2/fixtures/gmail/inbox.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T129zh_business_trip_planning_plus_2/fixtures/calendar/events.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T129zh_business_trip_planning_plus_2/fixtures/contacts/contacts.json
prompt:
  text: '我需要规划一次跨区售后巡检。请基于收件箱中的“现场巡检/故障回访/到访”邮件，结合日历现有安排判断是否需要调整行程，并为多个区域找到对接联系人。要求：

    1）从收件箱筛出所有需要我去现场的“到访邀请”（排除/不执行线上会议；对缺信息的变更邮件仅视为干扰或提醒，不当作可执行邀请）；

    2）对每个到访邀请对应日期，在日历里核对是否存在冲突；若事件跨天也要正确纳入冲突判断；

    3）重点处理“最迟在某日中午前到达”的边界条件：若日历在该日中午前被硬占用，则必须调整到空闲时段或调整先后顺序；

    4）为每个涉及的区域在通讯录中检索当地对接联系人（联系人需归属正确）；

    5）最终输出：建议的巡检路线（按顺序：去哪些区域、对应日期、到达/离开时段建议）、需要改期/调整的原因，以及每个区域的联系人清单（每区不少于2人）。'
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
environment:
  mock_today: '2026-03-25'
  timeout_seconds: 600
  max_turns: 30
