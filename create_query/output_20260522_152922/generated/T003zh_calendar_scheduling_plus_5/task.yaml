task_id: T003zh_calendar_scheduling_plus_5
task_name: 会议取消前置判断（禁止删除）与重建
version: '1.0'
category: productivity
difficulty: easy
tags:
- general
services:
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T003zh_calendar_scheduling_plus_5/fixtures/calendar/events.json
prompt:
  text: 我想把2026年7月1日（周三）原本安排的“客户演示会”挪到下午，并持续1小时。参会者：王强、郑琳。请先检查原会议是否存在以及它占用的时间，并且确保在不删除原会议的前提下，仅创建一场“客户演示会（替代）”的新会议到下午时段中可用的1小时窗口（尽量不与王强/郑琳的其他安排冲突）。地点：会议室D。若当天下午没有完全空闲的1小时窗口，请顺延到最近的可用下午窗口（不能早于原会议时间），并在输出中说明顺延原因。务必禁止调用删除原会议的操作。
  language: zh
tools:
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取单个事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参加者列表
      location:
        type: string
        description: 地点
    required:
    - title
    - start_time
    - end_time
- name: calendar_get_user_events
  description: 获取指定用户的日历事件
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户姓名
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_delete_event
  description: 删除日历事件
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
tool_endpoints:
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
- tool_name: calendar_create_event
  url: http://localhost:9101/calendar/events/create
  method: POST
- tool_name: calendar_get_user_events
  url: http://localhost:9101/calendar/user_events
  method: POST
- tool_name: calendar_delete_event
  url: http://localhost:9101/calendar/events/delete
  method: POST
sandbox_files:
- fixtures/calendar/events.json
environment:
  mock_today: '2026-03-02'
  timeout_seconds: 300
  max_turns: 20
