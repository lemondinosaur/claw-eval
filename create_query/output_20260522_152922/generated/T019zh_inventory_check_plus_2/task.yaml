task_id: T019zh_inventory_check_plus_2
task_name: Warehouse Transfer Reorder
version: '1.0'
category: operations
difficulty: easy
tags:
- general
services:
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T019zh_inventory_check_plus_2/fixtures/inventory/products.json
prompt:
  text: 我们仓库之间本周只能调拨两次额度商品，额度已接近用尽。请帮我核查现有库存：考虑不可调拨标记 non_transferable、在途库存 in_transit_units（以及
    lead_time_days），判断哪些商品必须直接向供应商下补货单以保证最低库存。只为确实需要外采的商品下单，数量按缺口与交期计算，并在结果中说明每个下单商品的原因与计算口径。
  language: zh
tools:
- name: inventory_list_products
  description: 获取商品库存列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按类别筛选
    required: []
- name: inventory_get_product
  description: 获取单个商品的详细库存信息
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 商品ID
    required:
    - product_id
- name: inventory_create_order
  description: 创建补货订单
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 商品ID
      quantity:
        type: integer
        description: 补货数量
      supplier:
        type: string
        description: 供应商
    required:
    - product_id
    - quantity
tool_endpoints:
- tool_name: inventory_list_products
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_product
  url: http://localhost:9108/inventory/products/get
  method: POST
- tool_name: inventory_create_order
  url: http://localhost:9108/inventory/orders/create
  method: POST
sandbox_files:
- fixtures/inventory/products.json
environment:
  timeout_seconds: 300
  max_turns: 20
