task_id: T035zh_vendor_procurement_plus_2
task_name: 灾备采购的供应商取舍
version: '1.0'
category: procurement
difficulty: hard
tags:
- general
services:
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_2/fixtures/finance/transactions.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_2/fixtures/kb/articles.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_2/fixtures/inventory/products.json
- name: rss
  command: python mock_services/rss/server.py
  port: 9109
  health_check: http://localhost:9109/rss/articles
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9109/rss/reset
  env:
    RSS_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_2/fixtures/rss/articles.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T035zh_vendor_procurement_plus_2/fixtures/crm/customers.json
prompt:
  text: '我们正在做灾备体系的服务器紧急采购评估。请不要下单或联系供应商，只输出评估结论。要求：

    1）从库存找出哪些机型会在“两周内”无法满足最低配置（在报告中标明机型、供应商与缺口原因）。

    2）从RSS提取供应商的交付与售后风险线索，重点对照“快速响应/快速发运承诺”与“工单积压/响应延迟”等矛盾信息。

    3）从CRM读取供应商最近一次合作状态，尤其关注“退货/维保相关备注”（至少覆盖一家供应商的退款或工单积压）。

    4）从知识库抓取评估权重与审批门槛，并说明在紧急采购场景下哪些规则仍必须遵守（如单一供应商集中度上限、审批阈值等）。

    5）结合财务预算与既往采购记录，解释“预算冻结/拨付延后”两种口径对可用额度的影响，并给出：在更保守口径下哪些采购金额将触发更高等级审批。

    6）输出“两阶段采购建议”和“先买谁、后买谁”的推荐顺序：阶段一优先采购能在窗口期内交付、风险可控的机型/供应商；阶段二在预算口径明确并/或审批完成后再补齐。


    输出中必须包含：阶段一/阶段二的采购顺序与理由、评分卡对比/权重解释、矛盾线索解释、以及审批与预算结论。'
  language: zh
tools:
- name: inventory_list_products
  description: 获取商品库存列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按类别筛选
    required: []
- name: inventory_get_product
  description: 获取单个商品的详细库存信息
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 商品ID
    required:
    - product_id
- name: rss_list_articles
  description: 获取文章列表
  input_schema:
    type: object
    properties:
      source:
        type: string
        description: 按来源筛选
      category:
        type: string
        description: 按类别筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: rss_get_article
  description: 获取文章完整内容
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: crm_list_customers
  description: 获取CRM客户列表，可按状态、等级、行业筛选
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选：active, inactive, churned
      tier:
        type: string
        description: 客户等级筛选：vip, standard
      industry:
        type: string
        description: 按行业筛选
    required: []
- name: crm_get_customer
  description: 获取单个客户的完整详细信息
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: finance_list_transactions
  description: 获取费用交易记录列表
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      end_date:
        type: string
        description: 结束日期 (YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取单笔交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
- name: finance_report_submit
  description: 提交财务报告
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 报告标题
      content:
        type: string
        description: 报告内容
      total_amount:
        type: number
        description: 总金额
      report_type:
        type: string
        description: 报告类型：expense, procurement, budget
    required:
    - title
    - content
tool_endpoints:
- tool_name: inventory_list_products
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_product
  url: http://localhost:9108/inventory/products/get
  method: POST
- tool_name: rss_list_articles
  url: http://localhost:9109/rss/articles
  method: POST
- tool_name: rss_get_article
  url: http://localhost:9109/rss/articles/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
- tool_name: finance_report_submit
  url: http://localhost:9104/finance/report/submit
  method: POST
sandbox_files:
- fixtures/inventory/products.json
- fixtures/rss/articles.json
- fixtures/crm/customers.json
- fixtures/kb/articles.json
- fixtures/finance/transactions.json
environment:
  timeout_seconds: 900
  max_turns: 40
