task_id: T105zh_job_failure_triage_plus_2
task_name: 支付对账延迟故障与工单关联
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_2/fixtures/scheduler/jobs.json
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_2/fixtures/helpdesk/tickets.json
prompt:
  text: '我们监控到支付对账持续延迟，部分结算单未能按时入账。请你完成：

    1）查看所有失败的支付对账/结算相关定时任务及其错误信息，并关注任务失败窗口（例如 23:50Z-次日00:20Z）。

    2）查看当前未解决的工单（open）。

    3）分析哪些工单与“支付对账/结算回写/商户通知”链路故障有关联：

    - DB死锁/超时：关联对账单未生成/结算待处理

    - 对象存储下载依赖失败：关联结算回写失败导致结算待处理加剧

    - 模板渲染异常：关联通知内容空白

    4）输出“任务-工单关联报告”：对每个故障任务列出对应工单列表、影响范围（财务入账/风控流程/商户通知等）、处理优先级与建议下一步。要求至少给出两处时间线证据（任务失败起点时间
    vs 工单创建/上报时间）。不需要关闭工单。'
  language: zh
tools:
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情（含执行历史）
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分类）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
tool_endpoints:
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
