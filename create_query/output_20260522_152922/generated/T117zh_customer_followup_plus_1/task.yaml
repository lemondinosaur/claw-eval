task_id: T117zh_customer_followup_plus_1
task_name: 逾期续订提醒（含干扰邮件）
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T117zh_customer_followup_plus_1/fixtures/crm/customers.json
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T117zh_customer_followup_plus_1/fixtures/gmail/inbox.json
prompt:
  text: "请帮我检查CRM与邮件线索以完成逾期续订跟进（今天视为2026-04-30）：\n1) 从CRM中筛选：status为active，且距离last_contact_date超过45天的客户；排除status为churned。\n\
    2) 对每位入选客户，调用其客户详情补充notes/联系人等关键信息。\n3) 在Gmail收件箱中检索与该客户相关的最后沟通线索：\n   - 如果存在多封候选邮件，选择最相关且最新的一封作为参考。\n\
    \   - 可能存在“主题/关键词相近但发件人与客户无关”的干扰邮件，需要据正文/公司名/代号等线索做关联判断。\n   - 若某客户缺少明确匹配邮件，可根据CRM\
    \ notes补写跟进要点，但不要捏造具体发件信息。\n4) 为每位目标客户仅起草邮件草稿（不发送）：\n   - VIP：语气更正式，明确提及续订价值与建议的时间安排（给出清晰的下一步时间窗口/回复期待）。\n\
    \   - standard：语气更友好简洁，询问当前使用情况并确认续订意向。\n5) 最终输出：\n   - “需跟进客户清单”（至少包含客户名、客户等级、last_contact_date）\n\
    \   - 每位客户对应的“邮件草稿摘要”（包含收件人、主题要点、关键句式/关注点）。\n全程不得调用发送邮件接口。"
  language: zh
tools:
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态(active/churned)
      tier:
        type: string
        description: 客户等级(vip/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
tool_endpoints:
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
