task_id: T123zh_todo_calendar_conflict_plus_1
task_name: 冲突重排：审计周
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T123zh_todo_calendar_conflict_plus_1/fixtures/todo/tasks.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T123zh_todo_calendar_conflict_plus_1/fixtures/calendar/events.json
prompt:
  text: '请帮我排查本周的待办与日历是否冲突，并输出重排建议。


    你的任务：

    1) 只考虑状态为 pending 的待办；completed 的待办作为干扰项忽略，不参与冲突判断。

    2) 拉取本周（mock_today=2026-04-10）起往后 7 天的日历事件。

    3) 将每个待办的 due_date 与当天日历占用时段对齐，识别哪些待办会被“全天/半天占用”的时间窗冲突（包括精确到上午/下午的不可改期窗口），并说明冲突原因。

    4) 对命中的冲突任务，进一步给出可行的重排建议：具体到“哪一天的哪一段（上午/下午/当晚等）”，说明应提前或延后到哪里。

    5) 对低优先级任务给出次级安排思路（可插空、可在无占用的半天或相邻日期改期）。


    输出格式建议：按日期列出冲突点（事件占用类型+命中待办），再列出每个冲突待办的重排方案，并按优先级（high > medium > low）体现建议的顺序与可行性。'
  language: zh
tools:
- name: todo_list_tasks
  description: 查看待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(pending/completed/all)
        default: pending
    required: []
- name: todo_get_task
  description: 获取待办详情
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办ID
    required:
    - task_id
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
tool_endpoints:
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_get_task
  url: http://localhost:9102/todo/tasks/get
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
environment:
  mock_today: '2026-03-27'
  timeout_seconds: 300
  max_turns: 20
