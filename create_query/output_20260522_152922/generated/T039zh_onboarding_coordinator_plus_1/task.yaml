    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_1/fixtures/gmail/inbox.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_1/fixtures/calendar/events.json
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_1/fixtures/todo/tasks.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_1/fixtures/contacts/contacts.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_1/fixtures/kb/articles.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_1/fixtures/inventory/products.json
prompt:
  text: "请你为“下周三”（按系统当前日期计算为具体YYYY-MM-DD，系统当前日期为2026-03-05）准备4位新员工的入职协调与排程：\n\n1)\
    \ 阅读HR收件箱入职邮件与IT库存邮件，分别提取每位新员工的部门、姓名、岗位需求（账号/设备/系统访问/培训要求）。\n2) 使用知识库查找入职流程清单、设备申请规则、培训建议时段、冲突调整原则，以及安全审查“需额外等待”的规则与缺货登记/临时备用策略。\n\
    3) 检索通讯录中各部门经理联系方式；若出现同名联系人歧义，需结合部门上下文选择正确邮箱。\n4) 检查库存：确认每位新员工所需设备是否可用；如缺货（包含“无线键盘套装”），记录到货日期，并为缺货设备创建跟进待办。\n\
    5) 查看日历冲突：在下周三根据知识库给出的培训建议时段安排培训；若培训时间段与已有会议冲突，则自动改到不冲突的附近空闲时段，且新培训时间需覆盖知识库所强调的核心模块时段。\n\
    6) 通知与邮件发送：\n   - 若某位员工所在部门存在部门经理，则给该部门经理发送入职通知。\n   - 若某部门无部门经理，则仅对该部门经理通知保存邮件草稿，不要发送。\n\
    7) 创建待办：至少为缺货设备跟进创建待办，并为账号准备与安全审查/等待依赖创建至少一条相关待办。\n8) 输出完整入职安排总结：覆盖4位员工的培训时间、设备状态（可用/缺货/临时方案）、安全审查是否阻塞、邮件发送或仅草稿的原因、以及待办清单摘要（包含缺货到货日期与跟进负责人）。"
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查看几天的日程
        default: 1
    required:
    - date
- name: calendar_get_user_events
  description: 获取指定用户在指定日期的日程
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户邮箱
      date:
        type: string
        description: 日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参会人邮箱列表
      location:
        type: string
        description: 会议地点
    required:
    - title
    - start_time
    - end_time
    - attendees
- name: todo_list_tasks
  description: 获取待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (pending/in_progress/completed)
      priority:
        type: string
        description: 按优先级筛选 (high/medium/low)
    required: []
- name: todo_create_task
  description: 创建新的待办事项
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 待办标题
      description:
        type: string
        description: 详细描述
      priority:
        type: string
        description: 优先级 (high/medium/low)
      due_date:
        type: string
        description: 截止日期 (YYYY-MM-DD)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - title
- name: todo_update_task
  description: 更新待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办事项ID
      status:
        type: string
        description: 新状态
      priority:
        type: string
        description: 新优先级
      title:
        type: string
        description: 新标题
      description:
        type: string
        description: 新描述
    required:
    - task_id
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: inventory_list_products
  description: 获取库存产品列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
      status:
        type: string
        description: 按库存状态筛选 (normal/out_of_stock/low_stock)
    required: []
- name: inventory_get_product
  description: 获取产品库存详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
