task_id: T039zh_onboarding_coordinator_plus_1
task_name: 入职冲突与设备补录协调
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
