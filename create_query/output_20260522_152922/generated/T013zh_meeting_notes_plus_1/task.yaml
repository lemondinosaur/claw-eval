task_id: T013zh_meeting_notes_plus_1
task_name: 周报行动项整理
version: '1.0'
category: productivity
difficulty: easy
tags:
- general
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T013zh_meeting_notes_plus_1/fixtures/notes/meetings.json
prompt:
  text: 请帮我把近期“安全与合规月度复盘会议”的要点和行动项整理出来，合并主会议纪要与其补充更新中的最新状态与交付物；提取每条行动项的负责人、交付物/描述、截止节点（或仅状态但要标注“无明确日期”）、紧急程度，并按紧急程度排序后整理成会议纪要，发送给本次主会议的全部参会人员（不包含任何非参会提及人员）。
  language: zh
tools:
- name: notes_list
  description: 获取会议记录列表
  input_schema:
    type: object
    properties:
      max_results:
        type: integer
        description: 最大返回数量
        default: 10
    required: []
- name: notes_get
  description: 根据ID获取会议记录详细内容
  input_schema:
    type: object
    properties:
      note_id:
        type: string
        description: 会议记录ID
    required:
    - note_id
- name: notes_share
  description: 将会议记录分享给其他人
  input_schema:
    type: object
    properties:
      note_id:
        type: string
        description: 会议记录ID
      recipients:
        type: array
        items:
          type: string
        description: 接收人列表
    required:
    - note_id
    - recipients
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
- tool_name: notes_share
  url: http://localhost:9105/notes/share
  method: POST
sandbox_files:
- fixtures/notes/meetings.json
environment:
  timeout_seconds: 300
  max_turns: 20
