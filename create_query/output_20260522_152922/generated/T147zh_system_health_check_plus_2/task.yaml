task_id: T147zh_system_health_check_plus_2
task_name: 身份同步一致性巡检
version: '1.0'
category: ops
difficulty: hard
tags:
- general
- multi_service
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T147zh_system_health_check_plus_2/fixtures/helpdesk/tickets.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T147zh_system_health_check_plus_2/fixtures/kb/articles.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T147zh_system_health_check_plus_2/fixtures/config/integrations.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T147zh_system_health_check_plus_2/fixtures/scheduler/jobs.json
prompt:
  text: "请帮我做一次“身份同步一致性”系统健康巡检：\n\n1）检查API集成配置状态，重点关注与“身份/用户数据”相关的集成（如 LDAP/SSO 映射、用户画像同步、用户/权限相关索引）。\n\
    2）检查定时任务运行情况，重点关注同步、索引重建或权限刷新任务，筛出失败/超时/频繁跳过刷新等异常。\n3）查看当前未解决工单，筛出可能由身份同步问题引起的工单（例如未登录可访问、角色不一致、用户画像缺失/展示不一致）。\n\
    4）在知识库中搜索与“映射字段缺失/权限刷新失败/索引一致性修复与验证/失败回滚”相关的解决方案，并提取可操作的修复步骤。\n5）输出系统健康报告：\n \
    \  - 先列出异常集成与异常定时任务（含失败原因片段）\n   - 构建至少两条故障链并写出时间线/因果关系\n   - 给出修复建议（必须包含验证步骤，例如：修复映射字段后重新触发权限刷新并核对权限结果；恢复索引一致性后核对索引更新时间与用户页面展示一致性）\n\
    \   - 不要关闭任何工单（仅建议处理）\n\n请确保报告围绕“数据一致性”与“权限错配”展开。"
  language: zh
tools:
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: config_list_integrations
  description: 列出系统集成配置
  input_schema:
    type: object
    properties:
      type:
        type: string
        description: 按类型筛选
      status:
        type: string
        description: 按状态筛选
    required: []
- name: config_get_integration
  description: 获取集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成ID
    required:
    - integration_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章全文
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
