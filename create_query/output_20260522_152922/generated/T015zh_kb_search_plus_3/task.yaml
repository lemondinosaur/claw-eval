task_id: T015zh_kb_search_plus_3
task_name: 企业设备与权限申请（知识库检索整合）
version: '1.0'
category: knowledge
difficulty: easy
tags:
- general
services:
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T015zh_kb_search_plus_3/fixtures/kb/articles.json
prompt:
  text: '你是企业IT服务助手。用户新加入远程团队，但不知道如何申请所需设备与开通远程办公权限。


    请基于知识库检索并整合至少4篇文章，输出：

    1) 设备申请流程（包含提交入口/需要提供的信息、审批链、预计处理时效与催办方式）；

    2) 标准配置选择逻辑（按岗位/远程工具需求选择笔记本/显示器/内存等，说明依据与差异）；

    3) 权限开通的操作路径与前置条件（例如先完成远程接入/VPN与协作工具注册，再申请系统权限；写明需要开通哪些权限类别及注意事项）；

    4) 边界条件与合规要求（离职归还、设备损坏报修、不得安装未经授权软件等），并说明违规后果或处理建议。


    要求：

    - 以清单形式给出可操作步骤，步骤要有顺序；

    - 对关键结论给出知识库来源引用（文章ID与标题）；

    - 不要调用或描述任何“更新知识库”的操作。'
  language: zh
tools:
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按类别筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: kb_update_article
  description: 更新知识库文章内容
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
      content:
        type: string
        description: 更新后的内容
    required:
    - article_id
    - content
tool_endpoints:
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: kb_update_article
  url: http://localhost:9106/kb/articles/update
  method: POST
sandbox_files:
- fixtures/kb/articles.json
environment:
  timeout_seconds: 300
  max_turns: 25
