task_id: T137zh_restock_chain_check_plus_5
task_name: 缓存过期引发的接口降级
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T137zh_restock_chain_check_plus_5/fixtures/scheduler/jobs.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T137zh_restock_chain_check_plus_5/fixtures/config/integrations.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T137zh_restock_chain_check_plus_5/fixtures/inventory/items.json
prompt:
  text: '自动补货系统部分品类补货不稳定。请进行链路排查并输出报告：

    1）列出所有补货定时任务，找出失败或重试频繁的任务；

    2）查看每个任务的失败详情，提取是否指向“缓存过期/接口降级/限流”等信号；

    3）检查关联API集成配置：是否存在降级开关、限流策略、错误率异常等线索；

    4）在库存中识别低于安全线的产品，并判断这些低库存是否确实由链路故障导致；

    5）输出3条故障链（任务 → 集成 → 库存），每条至少包含：任务失败/重试证据、对应集成异常线索、至少2个低于安全线的产品；

    最后补充一段边界条件：说明哪些“仅延迟/仅降级但未触发低库存”不会构成故障链，并说明你如何区分（结合库存是否破线 + 集成异常是否匹配）。'
  language: zh
tools:
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: config_list_integrations
  description: 查看集成配置列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(active/inactive/all)
    required: []
- name: config_get_integration
  description: 获取集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成ID
    required:
    - integration_id
- name: inventory_list_items
  description: 查看库存列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
    required: []
- name: inventory_get_item
  description: 获取库存品详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
tool_endpoints:
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
- tool_name: inventory_list_items
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_item
  url: http://localhost:9108/inventory/products/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
