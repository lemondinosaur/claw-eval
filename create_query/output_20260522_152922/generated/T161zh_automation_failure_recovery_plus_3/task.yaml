task_id: T161zh_automation_failure_recovery_plus_3
task_name: 多租户数据隔离异常引发链路停止
version: '1.0'
category: ops
difficulty: hard
tags:
- general
- multi_service
services:
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_3/fixtures/scheduler/jobs.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_3/fixtures/config/integrations.json
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_3/fixtures/helpdesk/tickets.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_3/fixtures/kb/articles.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_3/fixtures/inventory/items.json
prompt:
  text: '你是运维：系统提示多项自动化任务连续失败，且仅表现为某些租户的库存可用性受影响。工单里也提到“A客户看得到但B客户看不到”或“隔离失败”。请按以下要求输出排查与恢复方案：


    1）列出失败定时任务及其依赖关系，重点还原从“租户隔离写入失败”到“下游安全中断/自动补货停止”的链路。

    2）检查API集成配置找出根因（与租户隔离标识相关，包含tenant_id/header/caller scope等）；说明为何是根因落在租户B而导致表象覆盖到所有租户。

    3）评估对库存可用性的影响范围：结合inventory中blocked/partial状态、last_sync跳变等现象，解释哪些商品受影响、受影响的原因是“写入403→一致性校验拒绝→共享缓存标记不可用→安全策略阻断”。

    4）关联对应用户工单并解释为什么只影响部分租户；区分“直接受影响租户工单 / 间接受影响（共享缓存告警触发）工单 / 与链路无关的硬件工单”。

    5）在知识库搜索并引用恢复方案，给出可操作步骤：修复隔离配置→验证写入成功→重跑一致性校验/清缓存→恢复自动补货并监控。

    6）输出故障分析和可执行恢复计划（按顺序、包含验证点），并说明在未完成关键修复前不应关闭工单。'
  language: zh
tools:
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情（含执行历史和依赖关系）
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: config_list_integrations
  description: 列出API集成配置
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(active/inactive/all)
    required: []
- name: config_get_integration
  description: 获取API集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成配置ID
    required:
    - integration_id
- name: inventory_list_products
  description: 列出库存产品
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
    required: []
- name: inventory_get_product
  description: 获取产品库存详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分类）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章全文
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
tool_endpoints:
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
- tool_name: inventory_list_products
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_product
  url: http://localhost:9108/inventory/products/get
  method: POST
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
