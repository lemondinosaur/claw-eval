task_id: T137zh_restock_chain_check_plus_1
task_name: 夜间补货链路排障
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T137zh_restock_chain_check_plus_1/fixtures/scheduler/jobs.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T137zh_restock_chain_check_plus_1/fixtures/config/integrations.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T137zh_restock_chain_check_plus_1/fixtures/inventory/items.json
prompt:
  text: "自动补货系统在“月初促销前夜”的夜间运行时出现异常。请完成补货链路排查并输出恰好3条“故障链”报告（任务→集成→受影响库存），每条链都要求满足：关联失败的补货定时任务，其原因能对应到集成异常类型；并且在库存中至少定位2个“quantity\
    \ < reorder_level”的受影响产品。\n\n排查步骤：\n1）列出所有补货定时任务，筛查出 last_status=failed 或 enabled=false\
    \ 的任务；\n2）对每个失败/被禁用任务，读取失败原因（error/last_status）并归纳失败类型；\n3）检查该失败任务关联的API集成配置：是否存在高\
    \ error_rate、status 为 inactive、credentials_expired/access token 过期等信号；\n4）从库存中定位哪些品类/产品已低于安全线（quantity\
    \ < reorder_level），并把它们与对应集成关联起来；\n5）最终输出恰好3条故障链：\n   - 每条链必须包含：任务ID与失败原因（从任务详情归纳）、集成ID与异常类型、至少2个受影响库存产品及其数量/安全线对比、根因分析、可执行修复建议（含优先级）。\n\
    \n注意：数据中包含“低库存但集成正常”的噪声品类。不要把这类噪声品类纳入3条故障链的受影响库存；如确实低于安全线，请在报告中说明其为“非本链路根因/不纳入该链”。"
  language: zh
tools:
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: config_list_integrations
  description: 查看集成配置列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(active/inactive/all)
    required: []
- name: config_get_integration
  description: 获取集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成ID
    required:
    - integration_id
- name: inventory_list_items
  description: 查看库存列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
    required: []
- name: inventory_get_item
  description: 获取库存品详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
tool_endpoints:
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
- tool_name: inventory_list_items
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_item
  url: http://localhost:9108/inventory/products/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
