task_id: T155zh_onsite_support_dispatch_plus_1
task_name: SLA-到场派遣（数据中心断电）
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
- multi_service
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T155zh_onsite_support_dispatch_plus_1/fixtures/gmail/inbox.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T155zh_onsite_support_dispatch_plus_1/fixtures/calendar/events.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T155zh_onsite_support_dispatch_plus_1/fixtures/contacts/contacts.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T155zh_onsite_support_dispatch_plus_1/fixtures/crm/customers.json
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T155zh_onsite_support_dispatch_plus_1/fixtures/helpdesk/tickets.json
prompt:
  text: "今天是 2026-04-02（本地时间）。请为“极光云计算”这家VIP客户的一张进入 critical 且 requires_onsite=true\
    \ 的紧急现场支持工单安排派遣。\n\n要求你：\n1) 通过 helpdesk_list_tickets 找到唯一需要现场的目标工单（open、priority=critical、requires_onsite=true）。\n\
    2) 用 helpdesk_get_ticket 获取 SLA 到场截止时间、故障描述、目标地址区域；再用 crm_get_customer 核对客户为 VIP、站点位置与\
    \ SLA 到场条款。\n3) 在收件箱中找到一封来自客户法务/运营的邮件（用 gmail_list_messages + gmail_get_message），提取关键到场窗口与“到达后30分钟内完成初始巡检，否则升级为合同罚款”的要求措辞。\n\
    4) 使用 contacts_search + contacts_get 获取三位工程师候选的技能与地点，并用 calendar_get_user_events\
    \ 检查今天的可用性/冲突：\n   - 工程师A：具备“电源/硬件故障定位 + 服务器远程控制切换（DR/主备）”能力，但今天 10:00-11:30 有不可打断会议。\n\
    \   - 工程师B：全天可用，擅长数据库恢复，但缺少电源故障定位能力。\n   - 工程师C：技能匹配度高，但因外地出差/高速封闭无法在 SLA 内到达（请从其日程或备注体现）。\n\
    5) 结合“60分钟内到达数据中心”的 SLA，选择首选工程师与备选工程师，并准备派遣理由。\n6) 最后用 gmail_save_draft 起草通知邮件草稿：邮件需分别发送给首选工程师与客户经理，并在抄送中包含技术总监；只保存草稿，不要发送。\n\
    \n邮件内容需包含：工单与站点摘要、SLA（到达时间）与到达后30分钟初始巡检/合同罚款升级的提醒、到场计划（用相对时间描述即可）、首选/备选安排与原因。"
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
      reply_to_message_id:
        type: string
        description: 回复的原邮件ID
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
- name: calendar_get_user_events
  description: 获取指定用户的日历事件
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户姓名
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选
      tier:
        type: string
        description: 客户等级筛选(vip/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分类）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
      assigned_to:
        type: string
        description: 指派给
    required:
    - ticket_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
- tool_name: calendar_get_user_events
  url: http://localhost:9101/calendar/user_events
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
environment:
  mock_today: '2026-03-26'
  timeout_seconds: 600
  max_turns: 30
