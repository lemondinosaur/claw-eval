task_id: T107zh_ticket_routing_plus_1
task_name: 分域故障优先级重算
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T107zh_ticket_routing_plus_1/fixtures/helpdesk/tickets.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T107zh_ticket_routing_plus_1/fixtures/kb/articles.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T107zh_ticket_routing_plus_1/fixtures/crm/customers.json
prompt:
  text: '目前有10个新打开的open客户工单需要做智能路由与升级建议。请逐一完成以下工作：

    1）读取工单详情，并关联到对应客户的CRM信息（客户等级：VIP/standard、合同状态/续约期窗口等）。

    2）针对每条工单的“主症状”在知识库中进行精确检索，拉取最匹配的KB文章全文（不要被工单描述中的干扰信息误导，仍以主症状为准）。

    3）依据流程SLA标准以及“VIP加速、续约期加速”规则，对每个工单重新评估建议优先级；如知识库“升级条件”提示更高等级触发，也需按KB升级条件执行。

    4）输出一份完整路由建议报告：

    - 每个工单：建议优先级、匹配到的KB文章（article_id或标题）、关键排查/处置步骤摘要、是否需要升级、升级原因。

    - 最后汇总：所有需要升级处理的工单清单，并说明每条工单应通知的内部团队（如技术负责人/成功经理/销售团队/风控等，按KB升级条件与本次规则确定）。


    注意：所有工单仅进行路由/优先级调整建议，不要求关闭工单。'
  language: zh
tools:
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分类）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章全文
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态(active/churned)
      tier:
        type: string
        description: 客户等级(vip/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
