task_id: T129zh_business_trip_planning_plus_3
task_name: 会议串联与改期
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T129zh_business_trip_planning_plus_3/fixtures/gmail/inbox.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T129zh_business_trip_planning_plus_3/fixtures/calendar/events.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T129zh_business_trip_planning_plus_3/fixtures/contacts/contacts.json
prompt:
  text: "我收到两类出差邀请：\n- 一封“重要峰会参会”（单日，要求上午到场签到）；\n- 一封“技术分会演讲/讨论会”（跨两天：第一天演讲，第二天圆桌讨论）。\n\
    \n请你规划出差并输出决策依据：\n1）从收件箱定位两类邀请并提取：城市、日期，以及关键时间（峰会签到时间、分会演讲/圆桌时段）；\n2）查询日历对应日期的事件，判断冲突：\n\
    \   - 将“强制/confirmed”的培训视为硬冲突；\n   - 将描述为 tentative/待定且正文包含“可调整/可与他人协调改期/候补”等线索的活动视为可协商冲突；\n\
    3）分别检索峰会城市与分会城市的联系人清单；\n4）给出最终参加方案：是否需要改期、改期到哪一天/哪个时段更合理，并列出最终行程（按日期列出）；同时输出联系人清单（至少2名/城）。\n\
    要求在不引入新多轮澄清的情况下完成推断与取舍，并说明你如何区分硬冲突与可协商冲突。"
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
environment:
  mock_today: '2026-03-25'
  timeout_seconds: 600
  max_turns: 30
