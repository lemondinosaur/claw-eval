task_id: T105zh_job_failure_triage_plus_3
task_name: 文件同步失败与工单影响面分析
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_3/fixtures/scheduler/jobs.json
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_3/fixtures/helpdesk/tickets.json
prompt:
  text: "近期多个部门反映资料库的文件没有及时同步或下载失败。请你：\n1）查看所有失败的文件同步/内容分发类定时任务及其错误信息（重点关注 file_sync\
    \ / cdn / content_distribute / index 相关tag）；\n2）查看当前未解决的工单（open）；\n3）分析哪些工单由文件同步失败引起，并区分主要影响面与次要影响面：\n\
    \   - 下载404/文件不存在：重点归因 TLS证书过期导致的CDN分发失败，以及与之时间先后相匹配的同步链路问题；\n   - 权限拒绝(AccessDenied)：重点归因\
    \ S3→中心仓权限拒绝并持续重试导致的中心仓缺失；\n   - 搜索结果缺少但可下载：若工单描述明确“可下载但找不到/搜索缺少”，可归因索引服务不可用；若描述能解释为“次要体验”，则标注为次要影响面；\n\
    4）输出关联分析报告：对每个故障定时任务，列出关联工单、归因要点（包含失败错误类型+失败窗口与工单created_at时间线先后）、影响范围（外部下载/内部内容索引/搜索体验等）、以及建议处理优先级（先恢复用户可用性）。\n\
    注意：不得把不相关的工单（例如会议室预定失败等）错误归因到文件同步/索引故障。"
  language: zh
tools:
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情（含执行历史）
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分类）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
tool_endpoints:
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
