task_id: T007zh_todo_management_plus_1
task_name: 合并重复并标记过期
version: '1.0'
category: productivity
difficulty: easy
tags:
- general
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T007zh_todo_management_plus_1/fixtures/todo/tasks.json
prompt:
  text: '请帮我整理一下待办：

    1）把重复项合并掉——以“将重复项标记为已完成（completed）”的方式完成合并，不要删除任何待办；保留至少一条作为主任务（主任务可以保持原状态）。

    2）把过期的待办显式标注为“过期”（只针对当前为 2026-04-10 时：状态为 pending 且 due_date 非空且早于 2026-04-10
    的任务）。


    同时输出结果：

    - 分组列出重复合并的原因（同义/同业务动作/相同范围；说明与非重复项差异点）

    - 分别展示：紧急/即将到期/待定/已过期/已完成（已完成任务不重新标记过期）。'
  language: zh
tools:
- name: todo_list_tasks
  description: 获取所有待办事项
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (pending/completed/all)
        default: all
    required: []
- name: todo_update_task
  description: 更新待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 任务ID
      title:
        type: string
        description: 新标题
      priority:
        type: string
        description: 优先级 (high/medium/low)
      status:
        type: string
        description: 状态 (pending/completed)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - task_id
- name: todo_create_task
  description: 创建新的待办事项
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 任务标题
      description:
        type: string
        description: 任务描述
      priority:
        type: string
        description: 优先级
      due_date:
        type: string
        description: 截止日期 (YYYY-MM-DD)
    required:
    - title
- name: todo_delete_task
  description: 永久删除待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 任务ID
    required:
    - task_id
tool_endpoints:
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_update_task
  url: http://localhost:9102/todo/tasks/update
  method: POST
- tool_name: todo_create_task
  url: http://localhost:9102/todo/tasks/create
  method: POST
- tool_name: todo_delete_task
  url: http://localhost:9102/todo/tasks/delete
  method: POST
sandbox_files:
- fixtures/todo/tasks.json
environment:
  timeout_seconds: 300
  max_turns: 25
