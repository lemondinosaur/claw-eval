task_id: T149zh_project_progress_report_plus_5
task_name: 资金与资源消耗预警
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
- multi_service
services:
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_5/fixtures/calendar/events.json
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_5/fixtures/notes/meetings.json
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_5/fixtures/todo/tasks.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_5/fixtures/contacts/contacts.json
prompt:
  text: "请为3个并行项目(Neon/Omega/Pulse)生成“资源消耗与进度预警”汇报。\n\n要求：\n1) 查找每个项目的成本/资源/预算审批/设备排期/关键人力等相关会议与纪要；\n\
    2) 阅读纪要行动项，提取其中提到的资源约束信息（人力、预算、设备窗口等）；\n3) 读取待办事项并按项目汇总：综合priority、due_date与status识别两类风险：\n\
    \   - 高优先延期：priority为high，且status!=completed且due_date<=mock_today(2026-03-30)（blocked_by即使为空也要基于逾期判断），或因资源约束导致“预计逾期”的线索需明确说明；\n\
    \   - 低优先堆积：priority为low/medium且仍为pending或in_progress，且在未逾期前提下pending/in_progress数量过多，作为“堆积风险”而非延期；\n\
    4) 输出每项目：完成率、风险清单（按高优先延期/低优先堆积两组分栏）、以及需要升级的事项（例如预算审批升级、关键人力申请、设备窗口备选确认等）；\n5)\
    \ 查找每个项目的资源负责人联系方式（邮箱+电话）。\n\n请注意：对于due_date在未来的任务，不要过度升级为高优先延期风险（尤其避免对Pulse未来due_date的medium任务误报）。"
  language: zh
tools:
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
- name: notes_list
  description: 列出会议纪要
  input_schema:
    type: object
    properties:
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: notes_get
  description: 获取纪要详情
  input_schema:
    type: object
    properties:
      note_id:
        type: string
        description: 纪要ID
    required:
    - note_id
- name: todo_list_tasks
  description: 查看待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(pending/completed/all)
        default: all
    required: []
- name: todo_get_task
  description: 获取待办详情
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办ID
    required:
    - task_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
tool_endpoints:
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_get_task
  url: http://localhost:9102/todo/tasks/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
environment:
  mock_today: '2026-03-24'
  timeout_seconds: 600
  max_turns: 35
