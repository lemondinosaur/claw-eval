task_id: T105zh_job_failure_triage_plus_4
task_name: 多环境回滚触发失败与工单匹配
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_4/fixtures/scheduler/jobs.json
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_4/fixtures/helpdesk/tickets.json
prompt:
  text: "近期我们在多环境进行发布与回滚操作时发现：回滚触发未按预期执行，导致相关环境处于不稳定状态。请你完成以下工作：\n\n1）查看所有失败的定时任务及其错误信息，重点识别“回滚触发类”任务（其执行历史中应包含\
    \ env=prod/stage 等环境字段及触发条件/错误原因）。\n2）查看当前未解决的工单（open），并解析每张工单描述中的环境标识与变更/回滚相关描述。\n\
    3）分析哪些工单与“特定环境的回滚触发失败”有关：\n   - 将生产（prod）与预发（stage）分别分组\n   - 说明关联依据（故障任务的触发条件、错误信息、执行时间线\
    \ vs 工单描述中的变更类型/现象/时间线）\n   - 排除干扰工单（例如仅通知延迟、审计日志缺失等与回滚触发链路无直接关系的）。\n4）输出关联分析报告，并给出处理优先级建议：生产影响优先，其次预发；同时说明每个故障任务对应哪些工单、影响范围与建议优先级。\n\
    \n最终报告请按“任务 → 环境 → 关联工单 → 触发链路证据 → 优先级建议”组织，并区分生产与非生产影响。"
  language: zh
tools:
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情（含执行历史）
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分类）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
tool_endpoints:
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
