task_id: T095_pinbench_apm_market_research_plus_4
task_name: 成本压测：消耗型定价与治理策略对比
version: '1.0'
category: research
difficulty: easy
tags:
- general
services:
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T095_pinbench_apm_market_research_plus_4/fixtures/kb/articles.json
prompt:
  text: '请基于知识库撰写一份“APM成本压测评估”竞争研究，场景发生在促销流量窗口前后：追踪与日志摄入可能短期放大，目标是评估成本在峰值期是否可被治理。要求：

    1）至少比较5家厂商；每家需说明三要素：①计费/定价模型的计费维度（仅做描述性归类，如按摄入/资源/席位/模块等，不要给出具体金额）；②导致成本上升的机制（例如摄入量激增、资源扩张、模块叠加、平台并行带来的重复成本等）；③成本治理或优化能力（从KB提取并概述）。

    2）总结至少4条与“消费型定价审查、摄入效率与数据治理、平台整合（减少多工具并行成本）”相关的市场趋势，趋势中需体现与上述语义要素接近的内容。

    3）输出：比较表、至少5点的“成本机制对照段落”（逐点对比不同厂商成本上升机制与治理差异，点数≥5），以及一段简短结论（落到如何在峰值期降低成本不确定性与治理建议）。

    注意：不得杜撰具体价格数字或未经KB支持的治理手段。'
  language: en
tools:
- name: kb_search
  description: Search the KB
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
        default: 5
    required:
    - query
- name: kb_get_article
  description: Get one KB article
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
sandbox_files:
- fixtures/kb/articles.json
environment:
  timeout_seconds: 300
  max_turns: 16
