task_id: T088_pinbench_project_bootstrap_plan_plus_4
task_name: Java Maven Library Plan
version: '1.0'
category: file_ops
difficulty: easy
tags:
- general
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T088_pinbench_project_bootstrap_plan_plus_4/fixtures/todo/tasks.json
prompt:
  text: 'Use the todo service to bootstrap a Java Maven library project plan for "gridhopper".
    Create actionable tasks for:

    1) creating the standard Maven directory layout and a starter class,

    2) adding JUnit test skeletons (include a clear behavior verification point for
    the boundary input of an empty string),

    3) writing pom.xml metadata with placeholders for groupId/artifactId/version plus
    dependency placeholder sections,

    4) writing a README that includes mvn build/test commands and a minimal example,

    5) adding tasks for a versioning workflow and a changelog entry template.

    Mark tasks with priority levels (high/medium/low) to reflect dependency order
    (metadata & structure first; docs and release steps later). Then summarize the
    setup plan in a way that explains how the priorities map to the dependency sequence.

    Also add exactly two noise todo tasks (one open, one done) whose titles do not
    mention "gridhopper".'
  language: en
tools:
- name: todo_create_task
  description: Create a new todo task
  input_schema:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      priority:
        type: string
      due_date:
        type: string
    required:
    - title
- name: todo_list_tasks
  description: List todo tasks
  input_schema:
    type: object
    properties:
      status:
        type: string
    required: []
tool_endpoints:
- tool_name: todo_create_task
  url: http://localhost:9102/todo/tasks/create
  method: POST
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
sandbox_files:
- fixtures/todo/tasks.json
environment:
  timeout_seconds: 180
  max_turns: 10
