task_id: T149zh_project_progress_report_plus_4
task_name: 跨部门依赖跟踪
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
- multi_service
services:
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_4/fixtures/calendar/events.json
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_4/fixtures/notes/meetings.json
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_4/fixtures/todo/tasks.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T149zh_project_progress_report_plus_4/fixtures/contacts/contacts.json
prompt:
  text: "请为3个并行项目（Horizon / Ivory / Jade）生成跨部门依赖跟踪进度报告。\n\n要求：\n1) 查找每个项目的关键评审会议，并读取对应纪要（通过会议标题/内容关键词区分关键评审，忽略无关会议）。\n\
    2) 从纪要的行动项中识别“外部依赖”类别与依赖关键词（例如：法务审查/供应商交付/运维变更窗口/安全扫描等）。\n3) 阅读 todo 中该项目的待办任务：匹配\
    \ task 的 blocked / blocked_by / 依赖字段（如存在）与纪要行动项中的外部依赖类别。\n   - 若 blocked_by 存在：按\
    \ blocked_by 对应的依赖类别计入“阻塞”。\n   - 若 blocked_by 缺失但纪要明确存在该外部依赖：结合任务状态（pending/in_progress）与\
    \ due_date（是否逾期或临近）做风险判断，并在报告中说明“依赖未显式录入 blocked_by，需追踪”。\n   - Jade 场景：若纪要说“运维变更窗口已确定”，但\
    \ todo 仍是 pending/in_progress 且 due_date 临近，应判定为“窗口后续跟进风险”，不要简单等同于 blocked。\n\
    4) 对每个项目输出：完成率、依赖风险 Top2（按数量+逾期/临近+优先级综合排序）、以及需要联系的负责人联系方式（邮箱与电话）。\n5) 同时汇总内部与外部依赖导致的阻塞数量（内部依赖以纪要行动项中项目组成员工作为主；外部依赖以纪要中的外部部门/外部方为主）。"
  language: zh
tools:
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
- name: notes_list
  description: 列出会议纪要
  input_schema:
    type: object
    properties:
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: notes_get
  description: 获取纪要详情
  input_schema:
    type: object
    properties:
      note_id:
        type: string
        description: 纪要ID
    required:
    - note_id
- name: todo_list_tasks
  description: 查看待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(pending/completed/all)
        default: all
    required: []
- name: todo_get_task
  description: 获取待办详情
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办ID
    required:
    - task_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
tool_endpoints:
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_get_task
  url: http://localhost:9102/todo/tasks/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
environment:
  mock_today: '2026-03-24'
  timeout_seconds: 600
  max_turns: 35
