task_id: T119zh_inventory_cost_analysis_plus_2
task_name: 同类跨币种换算核对
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T119zh_inventory_cost_analysis_plus_2/fixtures/inventory/items.json
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T119zh_inventory_cost_analysis_plus_2/fixtures/finance/transactions.json
prompt:
  text: "请帮我做一次库存与采购成本的交叉核对（重点：采购交易可能使用 USD/EUR 等不同币种，需要按交易币种和给定汇率换算为人民币后再与库存 unit_cost（假定为\
    \ CNY）核对）。\n\n1）查看当前所有库存品的数量和单位成本（库存 unit_cost 默认按人民币 CNY 表示）\n2）查询财务系统中与每个库存品对应的采购交易（可能来自不同币种）\n\
    3）对候选采购交易：\n   - 只纳入 status='completed'，排除 pending\n   - 只纳入 type='采购'\n   - 严格匹配\
    \ reference（应能对应到正确的 product_id）\n4）将每笔交易金额按其币种与交易详情提供的汇率换算为人民币（CNY），推导对应的采购单价，并与库存\
    \ unit_cost 比对\n5）找出成本异常的品类：\n   - 例如：汇率未换算导致单价不一致，或换算后单价偏离\n6）输出成本分析报告：\n   -\
    \ 每个品类的换算后对比结果\n   - 对异常品类给出完整换算依据/过程（币种、原始单价或可推导单价、汇率、换算后单价、差异与方向）\n   - 说明为何排除了\
    \ pending/非采购/错引用交易"
  language: zh
tools:
- name: inventory_list_items
  description: 查看库存列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
    required: []
- name: inventory_get_item
  description: 获取库存品详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
- name: finance_list_transactions
  description: 查看交易记录
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 起始日期(YYYY-MM-DD)
      end_date:
        type: string
        description: 截止日期(YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
tool_endpoints:
- tool_name: inventory_list_items
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_item
  url: http://localhost:9108/inventory/products/get
  method: POST
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
