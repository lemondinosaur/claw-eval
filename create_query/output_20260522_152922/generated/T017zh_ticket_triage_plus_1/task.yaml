task_id: T017zh_ticket_triage_plus_1
task_name: 云盘同步故障排查优先级
version: '1.0'
category: operations
difficulty: easy
tags:
- general
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T017zh_ticket_triage_plus_1/fixtures/helpdesk/tickets.json
prompt:
  text: 帮我梳理当前待处理工单（全部为 open 状态）：按问题类型分组并给出优先级与归类（例如：云盘同步、账号权限、网络连通、客户端软件/兼容）。对同源问题给出关联原因（优先依据错误码/故障开始时间窗口/客户端平台/权限变更动作/网络症状等线索），把能够互相印证的工单标为同一关联组。请不要关闭任何工单，只更新每条工单的
    priority、tags 和 category。最终输出：1）关联组摘要；2）更新清单（ticket_id -> priority/category/tags）。
  language: zh
tools:
- name: helpdesk_list_tickets
  description: 获取工单列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选 (open/closed/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单信息
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级 (urgent/high/medium/low)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 分类
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决方案描述
    required:
    - ticket_id
    - resolution
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
sandbox_files:
- fixtures/helpdesk/tickets.json
environment:
  timeout_seconds: 300
  max_turns: 30
