task_id: T123zh_todo_calendar_conflict_plus_2
task_name: 双时区会议冲突
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T123zh_todo_calendar_conflict_plus_2/fixtures/todo/tasks.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T123zh_todo_calendar_conflict_plus_2/fixtures/calendar/events.json
prompt:
  text: '请帮我检查待办截止日当天是否发生冲突：日历事件可能以不同城市时区录入，你需要先把每个事件换算到我的本地时间，再判断它在“截止日”占用了哪段可用时间。


    请输出：

    1) 冲突点列表（说明是哪一天、哪些本地时段被占用、以及涉及哪些待办）；

    2) 对每个冲突待办给出具体重排建议：要提前/延后到哪一天、上午/下午/前一天，并说明理由（结合估时与优先级）。

    3) 对 estimated_hours=0 的异常待办，说明你会如何处理（不要把它误判为必然造成冲突），并给出不影响主重排的建议。'
  language: zh
tools:
- name: todo_list_tasks
  description: 查看待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(pending/completed/all)
        default: pending
    required: []
- name: todo_get_task
  description: 获取待办详情
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办ID
    required:
    - task_id
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
tool_endpoints:
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_get_task
  url: http://localhost:9102/todo/tasks/get
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
environment:
  mock_today: '2026-03-27'
  timeout_seconds: 300
  max_turns: 20
