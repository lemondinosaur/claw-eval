task_id: T125zh_meeting_action_items_plus_5
task_name: 跨团队会议行动项汇总
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T125zh_meeting_action_items_plus_5/fixtures/notes/meetings.json
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T125zh_meeting_action_items_plus_5/fixtures/todo/tasks.json
prompt:
  text: '请帮我做跨团队会议行动项汇总：

    1）查看所有会议纪要

    2）提取每个会议里的行动项

    3）查看当前待办清单

    4）把会议行动项与已有待办做去重对比，找到对应关系（避免重复创建）；对“负责人待定/未知”的行动项，在仍可从纪要中提取到动作与截止日期时，允许与待办中具体负责人出现“不确定性匹配”，但需要在追踪表中如实标注负责人

    5）输出行动项追踪表：来源会议、负责人、截止日期、是否已有待办（已有要给出待办ID）以及需要新建的待办列表。


    干扰处理要求：

    - 纪要中出现“计划在下次会议确认/下次确认”的内容，即使有日期但缺少明确行动项与负责人，也不要当作行动项。

    - 若行动项负责人写为“（待定）/待定/未知”，请在追踪表的负责人字段保留为“待定/未知”。'
  language: zh
tools:
- name: notes_list
  description: 列出会议纪要
  input_schema:
    type: object
    properties:
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: notes_get
  description: 获取纪要详情
  input_schema:
    type: object
    properties:
      note_id:
        type: string
        description: 纪要ID
    required:
    - note_id
- name: todo_list_tasks
  description: 查看待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(pending/completed/all)
        default: all
    required: []
- name: todo_get_task
  description: 获取待办详情
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办ID
    required:
    - task_id
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_get_task
  url: http://localhost:9102/todo/tasks/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
