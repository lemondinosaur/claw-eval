  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_3/fixtures/inventory/products.json
prompt:
  text: '系统当前日期为2026-03-05。请你对“下周五”入职当天的5位新员工完成分组培训与入职协调：

    1) 从HR邮件读取5位员工的姓名、部门、岗位（如有）以及可参加时段（上午/下午/均可），并以同一入职日期创建一个或多个不冲突的培训事件；

    2) 从IT设备库存更新邮件读取库存状态，重点处理“人体工学椅”处于low_stock的情况：仅紧张不等于缺货，但需要按知识库规则准备“紧张→替代型号登记与跟进”的方案；

    3) 从知识库确认入职培训组织方式（可按可参加性分为上午组/下午组）以及设备申请/账号准备的步骤与登记说明；

    4) 在通讯录中检索各部门经理（处理同名干扰：用部门字段区分），并确保供应链/仓配协同部门无经理记录时不发送邮件而仅保存草稿；

    5) 检查日历中“当日”已有会议碎片时段，选择不与现有事件重叠的上午/下午培训窗口；

    6) 为有经理的部门发送按组别内容的通知；无经理部门仅保存草稿；

    7) 最后创建待办事项：至少包含“培训签到提醒/账号准备/设备申请跟进”，并额外创建与“人体工学椅低库存替代确认”相关的待办；

    8) 输出总结：按部门与组别列出5位员工的培训安排、冲突检查与调整结果、设备库存状态（含low_stock紧张与替代方案）以及待办清单摘要。


    要求：所有培训事件的时间与当日既有会议不重叠，并覆盖上午组与下午组（至少各1个事件）。'
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查看几天的日程
        default: 1
    required:
    - date
- name: calendar_get_user_events
  description: 获取指定用户在指定日期的日程
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户邮箱
      date:
        type: string
        description: 日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参会人邮箱列表
      location:
        type: string
        description: 会议地点
    required:
    - title
    - start_time
    - end_time
    - attendees
- name: todo_list_tasks
  description: 获取待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (pending/in_progress/completed)
      priority:
        type: string
        description: 按优先级筛选 (high/medium/low)
    required: []
- name: todo_create_task
  description: 创建新的待办事项
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 待办标题
      description:
        type: string
        description: 详细描述
      priority:
        type: string
        description: 优先级 (high/medium/low)
      due_date:
        type: string
        description: 截止日期 (YYYY-MM-DD)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - title
- name: todo_update_task
  description: 更新待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办事项ID
      status:
        type: string
        description: 新状态
      priority:
        type: string
        description: 新优先级
      title:
        type: string
        description: 新标题
      description:
        type: string
        description: 新描述
    required:
    - task_id
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: inventory_list_products
  description: 获取库存产品列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
      status:
        type: string
        description: 按库存状态筛选 (normal/out_of_stock/low_stock)
    required: []
- name: inventory_get_product
  description: 获取产品库存详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
