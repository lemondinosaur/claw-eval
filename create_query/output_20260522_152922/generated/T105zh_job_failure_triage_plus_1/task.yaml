task_id: T105zh_job_failure_triage_plus_1
task_name: 告警转发失败关联排查
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_1/fixtures/scheduler/jobs.json
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_1/fixtures/helpdesk/tickets.json
prompt:
  text: '近期多位值班同事反馈：告警没有被正确转发到值班台。请你完成：

    1）查看调度平台中所有“告警转发类”且状态为失败的定时任务，提取最近一次失败时间窗口与关键错误类型；

    2）查看工单系统当前所有未解决（open）的工单，并逐条读取其描述中的时间线与症状；

    3）分析哪些工单与“告警转发失败”存在直接关联（需基于任务失败时间窗与工单首次上报时间的先后关系，且排除与告警链路无关的干扰工单/硬件问题）；

    4）输出关联分析报告：按“失败定时任务 → 关联工单 → 可能影响的团队/功能（如值班台/告警看板）→ 建议处理优先级（critical/high/medium/low）与依据”组织，且分别覆盖两类故障模式（如
    Kafka broker 不可达、Webhook 签名密钥轮换未同步）。'
  language: zh
tools:
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情（含执行历史）
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分类）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
tool_endpoints:
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
