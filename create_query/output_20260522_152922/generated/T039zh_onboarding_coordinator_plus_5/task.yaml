prompt:
  text: '以系统今天（mock_today：2026-03-05）为准，为HR在今天宣布的3位“紧急入职”员工协调当天培训、设备与账号准备。


    要求按如下流程完成：

    1) 从Gmail Inbox中定位并只处理与“紧急入职”相关的HR邮件与库存更新邮件；忽略与入职无关的群发公告干扰。

    2) 从知识库确认“当天培训（最短流程）”的具体时段选择规则与“风险/草稿标注”要求：若存在安全审查未完成或设备缺货，则对相应部门经理的通知必须先以邮件草稿形式提交，并在草稿中标注风险点与预计完成时间。

    3) 从通讯录查找3位员工各自的部门经理（若同一部门可能缺失经理也要能处理草稿；本题以经理存在为主）。注意同名联系人可能出现时不要误用。

    4) 检查今天的日历冲突：当天培训需选择不与既有会议碎片冲突的窗口，并创建当天培训日历事件。

    5) 查询IT库存：确认无线耳机缺货与可用替代型号；将设备状态与替代方案用于后续沟通与待办。

    6) 邮件策略：当规则允许临时推进（例如提供临时替代设备或限制权限下可先行推进）时，在同一流程中再发送一封“已允许推进范围”的补充说明邮件（发送对象与草稿对应部门经理一致）。涉及安全审查未完成或缺货的内容仍需在补充说明中清晰标注仍待完成事项与预计时间。

    7) 为每位员工创建待办事项：包含当天培训签到/资料整理、权限审查或设备替代跟进等要点，并覆盖高优先级风险跟进。

    8) 输出一份入职协调总结：逐人说明培训时间、设备状态（是否缺货与替代）、邮件处理状态（草稿/补充说明已发送或未发送原因）、预计完成时间引用与待办列表。


    最终请给出清晰的总结，且总结不得提及无关群发公告邮件内容。'
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查看几天的日程
        default: 1
    required:
    - date
- name: calendar_get_user_events
  description: 获取指定用户在指定日期的日程
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户邮箱
      date:
        type: string
        description: 日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参会人邮箱列表
      location:
        type: string
        description: 会议地点
    required:
    - title
    - start_time
    - end_time
    - attendees
- name: todo_list_tasks
  description: 获取待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (pending/in_progress/completed)
      priority:
        type: string
        description: 按优先级筛选 (high/medium/low)
    required: []
- name: todo_create_task
  description: 创建新的待办事项
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 待办标题
      description:
        type: string
        description: 详细描述
      priority:
        type: string
        description: 优先级 (high/medium/low)
      due_date:
        type: string
        description: 截止日期 (YYYY-MM-DD)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - title
- name: todo_update_task
  description: 更新待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办事项ID
      status:
        type: string
        description: 新状态
      priority:
        type: string
        description: 新优先级
      title:
        type: string
        description: 新标题
      description:
        type: string
        description: 新描述
    required:
    - task_id
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: inventory_list_products
  description: 获取库存产品列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
      status:
        type: string
        description: 按库存状态筛选 (normal/out_of_stock/low_stock)
    required: []
- name: inventory_get_product
  description: 获取产品库存详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
