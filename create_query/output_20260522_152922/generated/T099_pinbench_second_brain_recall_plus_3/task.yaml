task_id: T099_pinbench_second_brain_recall_plus_3
task_name: 'Second Brain: Startup Launch Capsule'
version: '1.0'
category: memory
difficulty: easy
tags:
- general
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T099_pinbench_second_brain_recall_plus_3/fixtures/notes/memory.json
prompt:
  text: 'Treat the notes service as my persisted second brain. Locate the stored launch
    recap note (the one that contains a launch recap capsule) and answer the following:


    1) What product type am I working on?

    2) When was the first release? Use the exact time window format I wrote (e.g.,
    “YYYY-MM” or “Qx YYYY”).

    3) Who is the owner and what company are they from?

    4) What is the product project called and what does it do?

    5) What is the release team’s private key phrase?


    Return your answers as:

    1. ...

    2. ...

    3. ...

    4. ...

    5. ...'
  language: en
tools:
- name: notes_list
  description: List notes
  input_schema:
    type: object
    properties:
      max_results:
        type: integer
        default: 10
    required: []
- name: notes_get
  description: Get one note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
sandbox_files:
- fixtures/notes/memory.json
environment:
  timeout_seconds: 180
  max_turns: 8
