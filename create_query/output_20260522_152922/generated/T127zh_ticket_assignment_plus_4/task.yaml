task_id: T127zh_ticket_assignment_plus_4
task_name: 多来源报告的责任归属甄别
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T127zh_ticket_assignment_plus_4/fixtures/contacts/contacts.json
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T127zh_ticket_assignment_plus_4/fixtures/helpdesk/tickets.json
prompt:
  text: '当前有6个未分配工单需要处理建议。请你查看每个工单详情（description、tags、标题/类别、reporter部门等线索），判断应归属到公司内部通讯录中的哪个处理人；另外有1个工单属于外部供应商/合同服务范畴（例如合同维保、第三方服务、租赁公司等证据明确），此类工单不能分配给内部处理人，必须在建议里明确标注为“需升级外包/无法内部分配”，并给出基于description的理由。


    输出要求：最终输出分配建议表，共6行（每个工单1行），字段齐全：工单ID→建议处理人→分配理由。

    - 对5个内部可分配工单：给出具体内部处理人姓名，并在理由中引用tags/description/类别线索。

    - 对1个外包噪声工单：建议处理人填写“需升级外包/无法内部分配”（固定短语），理由必须引用description证据（如合同维保/第三方服务/租赁等字样），且说明不应分配内部。'
  language: zh
tools:
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
