task_id: T141zh_sla_compliance_audit_plus_4
task_name: SLA升级阈值误配置导致过早升级
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T141zh_sla_compliance_audit_plus_4/fixtures/helpdesk/tickets.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T141zh_sla_compliance_audit_plus_4/fixtures/scheduler/jobs.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T141zh_sla_compliance_audit_plus_4/fixtures/config/integrations.json
prompt:
  text: '请帮我做一次SLA合规审查（重点验证“升级阈值”是否与“响应时间SLA”一致），并输出分析报告：

    1) 查看系统配置中的SLA响应时间规则，并重点核对每个优先级的 escalation_after_minutes 与对应 response_time_minutes/策略类型是否合理匹配。

    2) 检查近期工单的时序：对比 created_at、first_response_at，以及是否存在 upgrade_at / 升级相关标签或升级时间戳；判断是否存在“升级过早但首次响应仍达标”或“升级过晚导致超标”的问题。

    3) 检查与“升级触发/标签打标/升级流程触发”相关的自动化任务运行状态：确认该类任务最近多次成功运行但行为异常（通常意味着参数/阈值配置问题，而非任务故障）。同时排除“邮件通知集成失效”这类导致缺失告警的干扰因素。

    4) 输出SLA合规分析报告：包含阈值一致性检查结果（给出量化不合理点）、异常工单明细（含关键时间字段与差值）、自动化与集成影响分析、以及修复建议（包括配置修正与增加校验/灰度回放建议）。'
  language: zh
tools:
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: config_list_integrations
  description: 列出系统集成配置
  input_schema:
    type: object
    properties:
      type:
        type: string
        description: 按类型筛选
      status:
        type: string
        description: 按状态筛选
    required: []
- name: config_get_integration
  description: 获取集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成ID
    required:
    - integration_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
