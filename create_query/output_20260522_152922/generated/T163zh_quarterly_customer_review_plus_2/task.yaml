task_id: T163zh_quarterly_customer_review_plus_2
task_name: 多地区客户健康度季度体检（Q3，缺失数据版）
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
- multi_service
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T163zh_quarterly_customer_review_plus_2/fixtures/gmail/inbox.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T163zh_quarterly_customer_review_plus_2/fixtures/contacts/contacts.json
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T163zh_quarterly_customer_review_plus_2/fixtures/finance/transactions.json
- name: rss
  command: python mock_services/rss/server.py
  port: 9109
  health_check: http://localhost:9109/rss/feeds
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9109/rss/reset
  env:
    RSS_FIXTURES: create_query/output_20260522_152922/generated/T163zh_quarterly_customer_review_plus_2/fixtures/rss/feeds.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T163zh_quarterly_customer_review_plus_2/fixtures/crm/customers.json
prompt:
  text: "现在是2026年10月初，请为Q3（7/1-9/30）生成“季度健康度体检报告”。CRM筛选到8个重点客户，覆盖华北与华南两个地区：其中华南地区邮件沉淀异常（Q3几乎没有往来邮件）。\n\
    \n对每个客户：\n1) 给出健康度结论（高/中/低）。\n2) 输出证据链并说明置信度：\n   - 财务证据（基于Q3交易汇总与交易详情，若仅有极少数据需明确这是缺失/不充分的证据来源）。\n\
    \   - CRM证据（满意度、合同到期节点、负责人角色字段sales_owner等）。\n   - 邮件证据（识别是否存在与客户相关的有效沟通；忽略与客户无关的内部通知干扰，给出“邮件缺失/仅有通知”的缺失说明，并指出缺失来自gmail服务）。\n\
    \   - 行业动态证据（使用RSS文章标题摘要与tags做弱匹配；若tags与客户行业标签不完全一致但摘要仍有相邻领域关联，说明匹配强度；若匹配度低需标注“行业证据弱”并说明不确定原因）。\n\
    3) 当某类证据缺失或出现矛盾时，必须给出“补证说明”（说明缺失来自哪个服务/为何影响置信度），并给出补采集路径。\n\n最后：\n- 列出“需要补采集信息”的客户清单（至少包含邮件缺失的客户）。\n\
    - 对每个需要补采集的客户，写1条建议的补采集路径（例如让客户经理补一次会议记录或让财务核对账单）。"
  language: zh
tools:
- name: finance_list_transactions
  description: 查看交易记录
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 起始日期(YYYY-MM-DD)
      end_date:
        type: string
        description: 截止日期(YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选
      tier:
        type: string
        description: 客户等级筛选(vip/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 30
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: rss_list_feeds
  description: 列出RSS订阅源
  input_schema:
    type: object
    properties: {}
    required: []
- name: rss_get_feed
  description: 获取RSS源文章列表
  input_schema:
    type: object
    properties:
      feed_id:
        type: string
        description: 订阅源ID
    required:
    - feed_id
- name: rss_get_article
  description: 获取文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
tool_endpoints:
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: rss_list_feeds
  url: http://localhost:9109/rss/feeds
  method: POST
- tool_name: rss_get_feed
  url: http://localhost:9109/rss/feeds/get
  method: POST
- tool_name: rss_get_article
  url: http://localhost:9109/rss/articles/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 40
