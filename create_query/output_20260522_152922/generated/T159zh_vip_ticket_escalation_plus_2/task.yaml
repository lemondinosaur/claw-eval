task_id: T159zh_vip_ticket_escalation_plus_2
task_name: VIP鉴权异常强制升级
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
- multi_service
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_2/fixtures/helpdesk/tickets.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_2/fixtures/crm/customers.json
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_2/fixtures/gmail/inbox.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_2/fixtures/contacts/contacts.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T159zh_vip_ticket_escalation_plus_2/fixtures/kb/articles.json
prompt:
  text: "VIP客户提交了critical级别的工单：需要你执行升级流程：\n1) 查看工单详情与其关联客户CRM信息，识别是否为VIP且读取SLA时间承诺。\n\
    2) 在知识库中搜索与“鉴权/权限校验失败（401/403）/鉴权回滚止血”最相关的处置方案，并提炼关键处置顺序与回滚/临时放行策略。\n3) 读取收件箱中该VIP客户安全负责人的紧急邮件，提取其强制要求的要点（至少包含：证据摘要与止血措施、以及要求的时限与合规风险）。\n\
    4) 通过通讯录检索找到：安全/架构技术负责人（执行人）、内部升级接收人（技术管理升级点）、以及VIP客户对接人（客户成功负责人）。\n5) 起草两封邮件草稿并保存到Gmail（不要发送）：\n\
    \   - 邮件A：发给VIP客户安全负责人（客户确认回复草稿），明确已启动止血措施、预计时间节点，并承诺在时限内提供“已定位原因的证据摘要”。邮件中需体现SLA时间承诺。\n\
    \   - 邮件B：发给内部升级接收人（内部升级通知草稿），需明确工单严重性、分配执行负责人、处置顺序（按KB提炼）与回滚/止血策略概要（包含“先止血/再定位/后回滚验证”的顺序）。\n\
    6) 最终确保只保存草稿（不调用发送工具）。"
  language: zh
tools:
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分配）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      assigned_to:
        type: string
        description: 分配给谁
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选
      tier:
        type: string
        description: 客户等级筛选(vip/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章全文
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
      reply_to_message_id:
        type: string
        description: 回复的原邮件ID
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
