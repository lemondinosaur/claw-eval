task_id: T139zh_customer_relationship_warning_plus_5
task_name: 跨产品线续约组合策略：按产品分拆沟通与草稿（仅保存不发送）
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T139zh_customer_relationship_warning_plus_5/fixtures/contacts/contacts.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T139zh_customer_relationship_warning_plus_5/fixtures/crm/customers.json
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T139zh_customer_relationship_warning_plus_5/fixtures/gmail/inbox.json
prompt:
  text: '请帮我检查所有活跃客户的合同到期情况，找出从今天起60天内即将到期的客户，并进一步按产品线分拆续约跟进策略。


    对于每个满足条件的客户：

    1）查看CRM详情，识别该客户包含的多个产品线及各自到期日期（平台/存储/安全等），并标记“优先产品线”；

    2）查找该客户销售负责人的联系方式（用于报告中的联系人信息）；

    3）检查收件箱中是否有针对特定产品线的近期沟通证据（邮件标题或正文会包含产品名缩写，如Plat/Store/Secu 之类），并统计沟通活跃度（高/低）；同时注意排除跨客户干扰（可能出现相同缩写但并非该客户或不属于该客户的产品线）；

    4）根据客户等级(VIP/standard)与每条产品线的沟通活跃度，制定“组合策略”（如：优先跟进/补充材料/二次触达节奏等）。


    对于VIP客户：要求为每条“优先产品线”分别起草不同角度的续约提醒邮件草稿（每条产品线一封草稿，主题必须包含该产品线名称），只保存草稿不发送。最后输出完整预警报告（按客户→产品线层级展示：到期时间、优先级、证据摘要与建议行动）。'
  language: zh
tools:
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选
      tier:
        type: string
        description: 客户等级筛选(vip/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 30
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
tool_endpoints:
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
environment:
  mock_today: '2026-03-26'
  timeout_seconds: 600
  max_turns: 30
