task_id: T007zh_todo_management_plus_2
task_name: 周内计划去重+紧急排序
version: '1.0'
category: productivity
difficulty: easy
tags:
- general
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T007zh_todo_management_plus_2/fixtures/todo/tasks.json
prompt:
  text: '帮我整理一下待办清单：

    1) 对“同一项目”的重复行动进行去重合并——不要删除任何待办项，而是把重复项更新为“标记完成”(status=completed)；

    2) 同时进行语义分流：若标题/描述涉及“电子版/纸质归档”等关键词差异，应避免把它们合并错（电子版与纸质归档属于不同子任务）。

    3) 重点排序：把“本周内到期”的待办排到前面，并在输出中明确标注分组；过期的也要标出来，但不要改变它们的优先级语义；due_date 为空的待办不要当作过期。

    当前日期锚点：2026-05-06（周三）。'
  language: zh
tools:
- name: todo_list_tasks
  description: 获取所有待办事项
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (pending/completed/all)
        default: all
    required: []
- name: todo_update_task
  description: 更新待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 任务ID
      title:
        type: string
        description: 新标题
      priority:
        type: string
        description: 优先级 (high/medium/low)
      status:
        type: string
        description: 状态 (pending/completed)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - task_id
- name: todo_create_task
  description: 创建新的待办事项
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 任务标题
      description:
        type: string
        description: 任务描述
      priority:
        type: string
        description: 优先级
      due_date:
        type: string
        description: 截止日期 (YYYY-MM-DD)
    required:
    - title
- name: todo_delete_task
  description: 永久删除待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 任务ID
    required:
    - task_id
tool_endpoints:
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_update_task
  url: http://localhost:9102/todo/tasks/update
  method: POST
- tool_name: todo_create_task
  url: http://localhost:9102/todo/tasks/create
  method: POST
- tool_name: todo_delete_task
  url: http://localhost:9102/todo/tasks/delete
  method: POST
sandbox_files:
- fixtures/todo/tasks.json
environment:
  timeout_seconds: 300
  max_turns: 25
