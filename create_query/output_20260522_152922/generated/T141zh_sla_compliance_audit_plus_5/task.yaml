task_id: T141zh_sla_compliance_audit_plus_5
task_name: SLA回放校验：历史差异与时区边界
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T141zh_sla_compliance_audit_plus_5/fixtures/helpdesk/tickets.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T141zh_sla_compliance_audit_plus_5/fixtures/scheduler/jobs.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T141zh_sla_compliance_audit_plus_5/fixtures/config/integrations.json
prompt:
  text: '请帮我做一次SLA合规审查（历史回放校验，重点处理时区/时间格式边界）：


    1) 查看系统配置中的SLA响应时间规则（四级阈值，单位为分钟），并说明阈值口径。

    2) 检查回放窗口内工单的首次响应时间：对created_at与first_response_at的时间戳字符串进行严谨解析并统一到同一时间标准后计算响应时长，判定达标/超标；注意时间戳可能包含Z结尾或带偏移（如+08:00）。回放窗口跨日（如23:30到次日00:30），因此要指出“忽略时区会导致判断翻转”的临界风险工单，并解释翻转原因（至少点名2条）。

    3) 检查与“历史SLA回放/修正报表”相关的scheduler自动化任务运行状态，判断是否存在延迟/失败，解释该异常为何会影响回放结果；并结合配置中与“时间标准/时区解析集成”相关的异常状态给出根因线索。

    4) 输出SLA合规回放分析报告：

    - 达标/超标明细（列出ticket_id、响应时长、对应优先级阈值、判定结果）

    - 至少2条“若忽略时区将导致判断翻转”的工单，说明边界风险

    - 对first_response_at为null的工单标注“无法判定/回放缺失风险”

    - 给出改进建议（统一时间标准、解析校验、回放失败补偿/幂等与一致性复核）。


    注意：审查阶段不要关闭任何工单。'
  language: zh
tools:
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: config_list_integrations
  description: 列出系统集成配置
  input_schema:
    type: object
    properties:
      type:
        type: string
        description: 按类型筛选
      status:
        type: string
        description: 按状态筛选
    required: []
- name: config_get_integration
  description: 获取集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成ID
    required:
    - integration_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
