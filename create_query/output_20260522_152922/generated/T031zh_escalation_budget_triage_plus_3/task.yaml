prompt:
  text: "请处理收件箱中标题/正文包含“年度续约谈判升级”的邮件。对每封邮件：\n1) 读取正文并提取字段：客户编号(customer_id)、续约谈判编号(renewal_id)、要求的补偿/优惠金额(allowance_amount)、是否表述“先保价后审”(is_price_hold_after_review)、触发渠道(trigger_channel，如Sales/客服等)以及季度(quarter)。\n\
    2) 从CRM获取该客户的tier、annual_revenue、status。\n3) 从helpdesk中匹配与该renewal_id、触发渠道一致的“续约谈判”工单版本，并更新工单priority与tags。\n\
    4) 决策规则（最终仍以5%阈值为准）：\n   - 若status=churned：标记异常并通知法务；同时按异常标签更新工单；不对客户发送“可先保价”承诺。\n\
    \   - 否则计算 ratio = allowance_amount / annual_revenue：\n     a) ratio <= 5% 且邮件声明“先保价后审”=是：发送确认邮件给客户服务联络人，正文明确“可先保价以争取续约推进，但不承诺最终批准细节”。\n\
    \     b) ratio <= 5% 但 is_price_hold_after_review=否：仅保存草稿要求上级审批（邮件标题/正文需体现“预算内但未先保价，需要上级审批”）。\n\
    \     c) ratio > 5%：仅保存草稿要求上级审批（体现“预算外/超出预算阈值，需要上级审批”）。\n5) 若finance里存在同客户同季度、status=completed且与“补偿/优惠”相关的历史记录：在摘要中写“历史记录存在/不存在”，并说明对当前邮件影响仅用于核验描述（不改变5%阈值决策）。\n\
    6) 最后对每条邮件输出处理摘要（含：邮件ID、续约谈判编号、比率、是否先保价、动作类型{send_confirm/draft_approval/abnormal_legal_notify/skip_missing_fields}、工单priority与tags、以及历史记录存在性）。\n\
    \n收件箱共有7封邮件：其中2封为干扰（缺少customer_id或renewal_id，或未声明“先保价后审”），这两封应skip并在摘要注明原因。"
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: helpdesk_list_tickets
  description: 获取工单列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (open/closed/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详细信息
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单信息
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级 (low/medium/high/critical)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: crm_list_customers
  description: 获取客户列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (active/churned)
      tier:
        type: string
        description: 按等级筛选 (vip/standard)
      industry:
        type: string
        description: 按行业筛选
    required: []
- name: crm_get_customer
  description: 获取客户详细信息
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: finance_list_transactions
  description: 获取财务交易记录列表
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      end_date:
        type: string
        description: 结束日期 (YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取财务交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
