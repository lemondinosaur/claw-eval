    CRM_FIXTURES: create_query/output_20260522_152922/generated/T031zh_escalation_budget_triage_plus_2/fixtures/crm/customers.json
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T031zh_escalation_budget_triage_plus_2/fixtures/finance/transactions.json
prompt:
  text: "收件箱中有若干封关于“多供应商争议退款升级”的邮件。请帮我处理：\n1. 阅读并读取所有升级邮件（共6封）。\n2. 对每封邮件，解析并提取：项目代码（用于工单匹配）、争议赔付金额、争议发生方（供应商A/供应商B/我方）、以及是否出现“外部法务接管”字样。\n\
    3. 对于能解析出“客户编号+争议赔付金额”的有效邮件：\n   3.1 在CRM中查找该客户的tier、annual_revenue与status。\n\
    \   3.2 在helpdesk中，依据“项目代码 + 争议发生方”从同项目代码的多条工单中选取最匹配的一条工单；然后更新该工单的priority与tags。\n\
    4. 分流与动作规则：\n   - 异常法务分支：若邮件声称“外部法务接管”或CRM状态为churned，则将选中工单标记为“异常-法务接管”，并通知法务联络人；禁止向客户服务联络人发送任何涉及“已批准/承诺退款/赔付”的话术。\n\
    \   - 预算内/外分支：否则计算 争议赔付金额 ÷ annual_revenue 的比例。\n       * 比例 <= 5%：发送通知邮件给客户服务联络人（主题注明“预算内处理”），正文仅做流程通知，不作“已批准赔付/保证赔付”的承诺。\n\
    \       * 比例 > 5%：仅保存草稿给客户服务联络人（主题注明“需上级审批-预算外”），正文避免任何承诺性赔付表述。\n   - 跳过规则：若赔付金额为0或缺失客户编号（即无法在CRM中定位客户），则不调用后续CRM/工单/发信流程，动作记为skip，并在摘要中说明原因。\n\
    5. 最终输出一份摘要：每条邮件包含项目代码、所选工单（或skip原因）、分流理由（预算内/预算外/异常-法务接管/skip）与采取的动作（sent/draft/legal/skip）。"
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: helpdesk_list_tickets
  description: 获取工单列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (open/closed/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详细信息
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单信息
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级 (low/medium/high/critical)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: crm_list_customers
  description: 获取客户列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (active/churned)
      tier:
        type: string
        description: 按等级筛选 (vip/standard)
      industry:
        type: string
        description: 按行业筛选
    required: []
- name: crm_get_customer
  description: 获取客户详细信息
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: finance_list_transactions
  description: 获取财务交易记录列表
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      end_date:
        type: string
        description: 结束日期 (YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取财务交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
tool_endpoints:
