task_id: T153zh_market_research_report_plus_4
task_name: 产品竞争对抗分析（替代威胁）
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
- multi_service
services:
- name: rss
  command: python mock_services/rss/server.py
  port: 9109
  health_check: http://localhost:9109/rss/articles
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9109/rss/reset
  env:
    RSS_FIXTURES: create_query/output_20260522_152922/generated/T153zh_market_research_report_plus_4/fixtures/rss/feeds.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T153zh_market_research_report_plus_4/fixtures/kb/articles.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T153zh_market_research_report_plus_4/fixtures/crm/customers.json
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T153zh_market_research_report_plus_4/fixtures/gmail/inbox.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T153zh_market_research_report_plus_4/fixtures/contacts/contacts.json
prompt:
  text: "你是市场研究与产品竞争分析团队的分析师。请完成《竞争对抗分析与产品替代威胁报告》，并保存给产品与销售协作委员会的邮件草稿（不要发送）。\n\n要求：\n\
    1) 先查看收件箱邮件，提取对报告的具体要求、以及销售侧对“竞品更容易替代”的线索与干扰提示。\n2) 从RSS抓取竞品能力升级与采用趋势，并过滤掉与“竞品替代威胁”无关的噪声内容；聚焦竞品的功能升级、定价/交付变化（如部署周期/服务交付承诺）、以及行业采用趋势。\n\
    3) 从知识库获取：我司相对竞品的差距、补强计划，以及对策/沟通策略模板（可用于后续对客户与销售话术的落点）。\n4) 从CRM按客户分层（VIP / standard）列出客户，再结合每个关键客户的notes（如：正在评估竞品、对集成敏感、合规顾虑、部署周期敏感等）判断最可能被替代的客户群。\n\
    5) 输出“威胁-机会-对策”矩阵：至少4行。每一行必须包含：\n   - 威胁描述（来自RSS/KB/CRM证据）\n   - 受影响客户群（明确VIP或standard及行业/特征）\n\
    \   - 机会点（为什么我们还能抢回）\n   - 对策（我们做什么）\n   - 证据来源（至少引用RSS/KB/CRM其中一类线索，且要能看出对应关系）\n\
    6) 给出“优先对策路线”，按季度拆分为“本季度 / 下季度”，并按优先级排序（至少各2条）。\n7) 保存邮件草稿：收件人必须分别来自通讯录中 department=“产品委员会”和\
    \ query=“销售委员会”的检索结果；邮件subject清晰包含“替代威胁”，正文包含矩阵摘要与季度路线图要点。只保存草稿，不调用发送。\n\n注意：RSS中可能夹杂与竞争无关的行业新闻，请优先保留与竞品升级/定价与交付变化/采用趋势直接相关的内容。"
  language: zh
tools:
- name: rss_list_articles
  description: 获取RSS文章列表
  input_schema:
    type: object
    properties:
      feed_name:
        type: string
        description: 按RSS源筛选
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: rss_get_article
  description: 获取文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章全文
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选(active/churned)
      tier:
        type: string
        description: 客户等级筛选(vip/standard)
      industry:
        type: string
        description: 按行业筛选
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
tool_endpoints:
- tool_name: rss_list_articles
  url: http://localhost:9109/rss/articles
  method: POST
- tool_name: rss_get_article
  url: http://localhost:9109/rss/articles/get
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
environment:
  timeout_seconds: 900
  max_turns: 40
