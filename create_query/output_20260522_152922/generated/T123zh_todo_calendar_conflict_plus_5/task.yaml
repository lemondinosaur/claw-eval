task_id: T123zh_todo_calendar_conflict_plus_5
task_name: 跨天边界与临时取消
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T123zh_todo_calendar_conflict_plus_5/fixtures/todo/tasks.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T123zh_todo_calendar_conflict_plus_5/fixtures/calendar/events.json
prompt:
  text: '请帮我检测：哪些待办会与日历事件发生真实冲突。


    要求：

    1) 先排除日历中标记为“canceled”的事件；

    2) 对跨天事件要严格按边界时间判断占用归属（例如 23:30 开始的会议，只计算其落在 23:30-24:00 与 00:00-对应时段的部分分别占用到对应日期）；

    3) 对 0 分钟异常事件（start_time 与 end_time 相同）不应产生有效占用，必须排除避免误判；

    4) 在输出中：明确列出被排除的事件（canceled/0分钟）；

    5) 对每个冲突的待办给出重排建议：具体到“日期 + 时段”，并保证建议不会安排到已占用时间。


    最终输出：每个关键待办的“冲突/非冲突”结论，以及可执行的重排建议。'
  language: zh
tools:
- name: todo_list_tasks
  description: 查看待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 状态筛选(pending/completed/all)
        default: pending
    required: []
- name: todo_get_task
  description: 获取待办详情
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办ID
    required:
    - task_id
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
tool_endpoints:
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
- tool_name: todo_get_task
  url: http://localhost:9102/todo/tasks/get
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
environment:
  mock_today: '2026-03-27'
  timeout_seconds: 300
  max_turns: 20
