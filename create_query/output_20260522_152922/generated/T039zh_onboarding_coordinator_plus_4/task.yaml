    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_4/fixtures/contacts/contacts.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_4/fixtures/kb/articles.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T039zh_onboarding_coordinator_plus_4/fixtures/inventory/products.json
prompt:
  text: "系统当前日期为2026-03-05。请为“下周一”（按系统当前日期计算出的2026-03-09）4位不同岗位新员工协调入职安排，并遵循失败重试预案流程：\n\
    \n1) 从HR邮件读取4位新员工信息（岗位需求、培训规则、以及参会人规则/特殊要求）。\n2) 在知识库中查找：入职培训与通知规则、以及IT设备申请与缺货处理规则（尤其是缺货如何登记/待办）。\n\
    3) 查通讯录获取：每位员工的部门经理邮箱；以及培训参会人至少包含IT支持主管与对应部门经理（若存在）。\n4) 检查IT库存：为缺货设备创建待办（并包含预计到货日期）。\n\
    5) 查看日历冲突：培训建议时段与已有事件冲突时，需调整到冲突外后再创建。\n6) 关键预案：在calendar_create_event创建任何培训/占位事件之前，先核验参会人邮箱是否可用。\n\
    \   - 如果某位参会人的联系人无法找到或邮箱缺失/为空：不要把该人员加入培训事件参会人列表。\n   - 若因为校验失败导致“应包含的参会人信息不完整”，则改为创建“不包含该参会人”的“占位培训事件”，并为“补齐该参会人信息”创建todo待办（due_date设为入职前1天）。\n\
    7) 通知：\n   - 有部门经理的部门：向部门经理发送通知邮件。\n   - 无部门经理的部门：只保存草稿不发送。\n8) 最终输出一份入职安排总结，必须覆盖4位员工：\n\
    \   - 参会人校验结果（哪些人有效/缺失原因）、占位事件创建原因\n   - 日历冲突处理与调整后的培训时间\n   - GPU/缺货设备清单、缺货与预计到货日期、以及已创建的跟进待办摘要\n\
    \   - 每位员工的设备/账号准备状态与待办列表摘要\n\n请确保整个流程中calendar_create_event发生前已经完成参会人邮箱有效性校验。"
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查看几天的日程
        default: 1
    required:
    - date
- name: calendar_get_user_events
  description: 获取指定用户在指定日期的日程
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户邮箱
      date:
        type: string
        description: 日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参会人邮箱列表
      location:
        type: string
        description: 会议地点
    required:
    - title
    - start_time
    - end_time
    - attendees
- name: todo_list_tasks
  description: 获取待办事项列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选 (pending/in_progress/completed)
      priority:
        type: string
        description: 按优先级筛选 (high/medium/low)
    required: []
- name: todo_create_task
  description: 创建新的待办事项
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 待办标题
      description:
        type: string
        description: 详细描述
      priority:
        type: string
        description: 优先级 (high/medium/low)
      due_date:
        type: string
        description: 截止日期 (YYYY-MM-DD)
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - title
- name: todo_update_task
  description: 更新待办事项
  input_schema:
    type: object
    properties:
      task_id:
        type: string
        description: 待办事项ID
      status:
        type: string
        description: 新状态
      priority:
        type: string
        description: 新优先级
      title:
        type: string
        description: 新标题
      description:
        type: string
        description: 新描述
    required:
    - task_id
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: inventory_list_products
  description: 获取库存产品列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
      status:
        type: string
        description: 按库存状态筛选 (normal/out_of_stock/low_stock)
    required: []
- name: inventory_get_product
  description: 获取产品库存详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
