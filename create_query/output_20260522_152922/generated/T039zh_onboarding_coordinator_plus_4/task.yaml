task_id: T039zh_onboarding_coordinator_plus_4
task_name: 失败重试预案：培训事件创建前先校验参会人
version: '1.0'
category: workflow
difficulty: hard
tags:
- general
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
