task_id: T141zh_sla_compliance_audit_plus_3
task_name: 静默工单堆积与补偿机制失效
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T141zh_sla_compliance_audit_plus_3/fixtures/helpdesk/tickets.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T141zh_sla_compliance_audit_plus_3/fixtures/scheduler/jobs.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T141zh_sla_compliance_audit_plus_3/fixtures/config/integrations.json
prompt:
  text: "请帮我做一次SLA合规审查（静默工单堆积与补偿机制失效）：\n\n1) 查看系统配置中的SLA响应时间规则（critical/high/medium/low）。\n\
    2) 列出最近窗口内处于 pending/assigned 状态的工单，计算“首次响应合规性”：\n   - 若 first_response_at 非空：按SLA阈值判断达标/超标/临界（临界=首次响应时间差值落在阈值±3分钟范围内）。\n\
    \   - 若 first_response_at 为空：使用当前评估时刻（由数据中的 current_at 字段提供）估算已等待时长并判定“未响应但已超时/未超时”，给出优先级与超时幅度。\n\
    3) 检查与“补偿响应/超时升级/工单再提醒”相关的自动化任务：找出 disabled 或反复失败的原因（结合任务 last_status、failure_count、error_message）。\n\
    4) 输出SLA合规分析报告：\n   - 超时/临界工单明细（含工单ID、优先级、等待时长、SLA阈值、判定原因、超时幅度/临界标注）。\n   - 静默堆积风险与影响分析（为何会“未触发通知升级/再提醒”）。\n\
    \   - 可操作的恢复步骤（立即启用/修复依赖/补跑未告警队列）与长期防复发建议（监控、冗余链路、堆积阈值）。\n\n注意：审查阶段不要关闭工单。"
  language: zh
tools:
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: config_list_integrations
  description: 列出系统集成配置
  input_schema:
    type: object
    properties:
      type:
        type: string
        description: 按类型筛选
      status:
        type: string
        description: 按状态筛选
    required: []
- name: config_get_integration
  description: 获取集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成ID
    required:
    - integration_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
