task_id: T105zh_job_failure_triage_plus_5
task_name: 会员积分核算异常与工单归因
version: '1.0'
category: ops
difficulty: medium
tags:
- general
- multi_service
services:
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_5/fixtures/scheduler/jobs.json
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T105zh_job_failure_triage_plus_5/fixtures/helpdesk/tickets.json
prompt:
  text: '最近会员积分核算出现异常：有人反映积分没有到账，有人反映到账后又被回滚。


    请你：

    1）查看所有失败的定时任务及其错误信息；

    2）查看当前未解决的工单；

    3）分析哪些工单与会员积分核算相关的定时任务故障有关联；

    4）输出关联分析报告：

    - 对每个“真实故障”任务，列出关联到的工单ID、症状摘要、关键时间线证据、可能影响范围；

    - 给出处理优先级建议（按用户影响量/时效性由高到低，并说明理由）；

    - 重要边界：有一个定时任务即使记录为失败，但错误属于“无数据可处理/业务上跳过”语义，你需要识别并排除它，避免被误认为根因。


    不需要关闭工单。'
  language: zh
tools:
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情（含执行历史）
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分类）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
tool_endpoints:
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
