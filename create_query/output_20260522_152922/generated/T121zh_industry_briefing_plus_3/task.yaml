task_id: T121zh_industry_briefing_plus_3
task_name: 医疗AI转化合规周报
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: rss
  command: python mock_services/rss/server.py
  port: 9109
  health_check: http://localhost:9109/rss/articles
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9109/rss/reset
  env:
    RSS_FIXTURES: create_query/output_20260522_152922/generated/T121zh_industry_briefing_plus_3/fixtures/rss/feeds.json
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T121zh_industry_briefing_plus_3/fixtures/gmail/inbox.json
prompt:
  text: '老板的医务助理要你写“医疗AI转化合规周报”（不发送邮件）。请：


    1）从RSS中筛选与“医疗AI临床应用/监管审评/医疗数据合规/模型验证/医院落地”直接相关的信息；排除泛泛的医学科普、可穿戴健康营销、非医疗领域的AI政策，以及仅发布模型能力但未涉及医疗场景或验证方法的内容。


    2）将筛到的信息按四类结构化归纳：

    A. 监管与审评

    B. 临床验证

    C. 数据与隐私

    D. 落地进展


    3）对每一类列出2条“风险点 + 应对建议”。语气务必谨慎、避免夸大结论。每条建议要能落到可执行的补充材料/验证设计/治理动作上。


    4）把内容整理成发给团队的邮件草稿（包含主题与正文结构），但不要调用发送接口，仅生成草稿供保存。'
  language: zh
tools:
- name: rss_list_articles
  description: 获取RSS文章列表
  input_schema:
    type: object
    properties:
      feed_name:
        type: string
        description: 按RSS源筛选
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: rss_get_article
  description: 获取文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 保存邮件草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人
      subject:
        type: string
        description: 主题
      body:
        type: string
        description: 正文
    required:
    - to
    - subject
    - body
tool_endpoints:
- tool_name: rss_list_articles
  url: http://localhost:9109/rss/articles
  method: POST
- tool_name: rss_get_article
  url: http://localhost:9109/rss/articles/get
  method: POST
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
