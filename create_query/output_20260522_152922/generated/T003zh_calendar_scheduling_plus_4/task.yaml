task_id: T003zh_calendar_scheduling_plus_4
task_name: 只凭部分数据仍完成（缺失用户日历处理）
version: '1.0'
category: productivity
difficulty: easy
tags:
- general
services:
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T003zh_calendar_scheduling_plus_4/fixtures/calendar/events.json
prompt:
  text: '请在2026年6月12日（周五）安排“技术方案评审”1小时。参会者：周微、董晨、项目负责人李昊。要求所有人空闲并避免冲突。地点：大会议室。


    注意：在生成的日历数据中，“项目负责人李昊”在该日期的日历数据可能缺失/返回为空。请你采取保守策略：仍需结合可获取的信息为该会议选择不冲突的时间窗；在创建前核实周微与董晨的时间不与其他已知事件冲突；若无法确认与整体事件线索完全不冲突，则选择更保守的空闲段或改为不创建并说明原因。输出中必须明确提到李昊当天无可获取的日历数据，因此采用了保守安排逻辑。'
  language: zh
tools:
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取单个事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参加者列表
      location:
        type: string
        description: 地点
    required:
    - title
    - start_time
    - end_time
- name: calendar_get_user_events
  description: 获取指定用户的日历事件
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户姓名
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_delete_event
  description: 删除日历事件
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
tool_endpoints:
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
- tool_name: calendar_create_event
  url: http://localhost:9101/calendar/events/create
  method: POST
- tool_name: calendar_get_user_events
  url: http://localhost:9101/calendar/user_events
  method: POST
- tool_name: calendar_delete_event
  url: http://localhost:9101/calendar/events/delete
  method: POST
sandbox_files:
- fixtures/calendar/events.json
environment:
  mock_today: '2026-03-02'
  timeout_seconds: 300
  max_turns: 20
