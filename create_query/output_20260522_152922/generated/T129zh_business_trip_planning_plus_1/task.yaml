task_id: T129zh_business_trip_planning_plus_1
task_name: 双城路演排期
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T129zh_business_trip_planning_plus_1/fixtures/gmail/inbox.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T129zh_business_trip_planning_plus_1/fixtures/calendar/events.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T129zh_business_trip_planning_plus_1/fixtures/contacts/contacts.json
prompt:
  text: "收件箱中可能有多封与路演/拜访相关的邀请邮件。请你规划一次“双城路演/拜访”出差：\n1）在收件箱中识别出所有关键出差邀请（忽略与出差无关的干扰邮件）；本任务通常会有两地关键邀请（城市不同、活动类型不同）。\n\
    2）根据两封关键邀请邮件中明确的日期范围与时间段，查询对应日期的日历事件；把“confirmed”视为硬冲突，把“待定”视为风险但不要当作必然硬冲突。\n\
    3）对每个城市分别检索当地同事/对接联系人（检索与该城市匹配的联系人并补全关键信息）。\n4）输出建议方案：\n   - 冲突结论：哪些行程不能同一天参加需要取舍（硬冲突来自\
    \ confirmed）；\n   - 风险提示：哪些与待定事件可能相关需要注意；\n   - 推荐行程顺序：到达/离开顺序应与冲突分析一致，并说明取舍理由（优先级/时间段）；\n\
    \   - 各城市联系人清单：至少列出每个城市2名联系人（姓名、职务/部门与联系方式或邮箱/电话）。"
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详情
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 查询日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查询天数
        default: 1
    required:
    - date
- name: calendar_get_event
  description: 获取事件详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
- name: contacts_search
  description: 搜索内部通讯录
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详情
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_event
  url: http://localhost:9101/calendar/events/get
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
environment:
  mock_today: '2026-03-25'
  timeout_seconds: 600
  max_turns: 30
