task_id: T093_pinbench_email_triage_report_plus_2
task_name: Billing & MFA Sweep
version: '1.0'
category: organization
difficulty: easy
tags:
- general
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T093_pinbench_email_triage_report_plus_2/fixtures/gmail/inbox.json
prompt:
  text: '请帮我按优先级整理收件箱：读取所有邮件，给出每封邮件的 Priority(P0-P4)、Category 和 Recommended action。报告顶部先写一段简短摘要，明确指出“最紧急”的事项（重点是计费中断/强制策略相关），并说明为何；最后给出今天的行动清单（按优先级从高到低）。


    要求：只做分诊与行动建议，不发送任何邮件。'
  language: en
tools:
- name: gmail_list_messages
  description: List inbox messages
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        default: 30
      max_results:
        type: integer
        default: 20
    required: []
- name: gmail_get_message
  description: Get one message
  input_schema:
    type: object
    properties:
      message_id:
        type: string
    required:
    - message_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
sandbox_files:
- fixtures/gmail/inbox.json
environment:
  timeout_seconds: 300
  max_turns: 18
