task_id: T099_pinbench_second_brain_recall_plus_1
task_name: 'Second Brain: Personal Tech Ledger'
version: '1.0'
category: memory
difficulty: easy
tags:
- general
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9105
  health_check: http://localhost:9105/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9105/notes/reset
  env:
    NOTES_FIXTURES: create_query/output_20260522_152922/generated/T099_pinbench_second_brain_recall_plus_1/fixtures/notes/memory.json
prompt:
  text: 'Treat the notes service as my persisted second brain. Find the stored memory
    note and answer these questions:


    1) What is my favorite database?

    2) What year did I first deploy it?

    3) Who is my mentor and what is their affiliation?

    4) What is my project called and what does it do?

    5) What is my team’s security check phrase?


    All answers must come from the single stored note that contains all five items
    (favorite database, first deployment year, mentor name+affiliation, project name+what
    it does, and the security check phrase).'
  language: en
tools:
- name: notes_list
  description: List notes
  input_schema:
    type: object
    properties:
      max_results:
        type: integer
        default: 10
    required: []
- name: notes_get
  description: Get one note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9105/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9105/notes/get
  method: POST
sandbox_files:
- fixtures/notes/memory.json
environment:
  timeout_seconds: 180
  max_turns: 8
