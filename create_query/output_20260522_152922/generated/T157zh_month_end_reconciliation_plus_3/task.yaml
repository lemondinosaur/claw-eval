task_id: T157zh_month_end_reconciliation_plus_3
task_name: 渠道分账与未对账客户
version: '1.0'
category: ops
difficulty: hard
tags:
- general
- multi_service
services:
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_3/fixtures/finance/transactions.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_3/fixtures/crm/customers.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_3/fixtures/config/integrations.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_3/fixtures/inventory/items.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T157zh_month_end_reconciliation_plus_3/fixtures/scheduler/jobs.json
prompt:
  text: '月底请做渠道分账对账与缺口修复排查：

    1）检查scheduler里是否存在“渠道分账/对账回填/批次回填”类任务失败、禁用或版本切换未生效；

    2）检查config中的系统集成配置，确认“渠道结算/回填同步”相关集成状态与last_sync时间是否滞后、是否降级；

    3）从finance本月交易中按channel（平台A/平台B/平台C）筛出收款，核对CRM里对应客户的应收expected_monthly是否已按新口径回填（或notes标记为“对账待回填/旧口径”）；找出“未对账客户/回填缺口”及金额缺口；

    4）核对inventory与被影响采购：对受影响客户关联的采购/订单对应的库存入库（批次维度）判断是否存在延迟入账或遗漏；

    5）输出对账报告：按渠道分组列出缺口金额、受影响客户列表、建议的回填策略与验证方法（需结合job/config的时间证据）。'
  language: zh
tools:
- name: finance_list_transactions
  description: 查看财务交易记录
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 起始日期(YYYY-MM-DD)
      end_date:
        type: string
        description: 截止日期(YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
- name: crm_list_customers
  description: 查看客户列表
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(active/inactive/churned)
      tier:
        type: string
        description: 按等级筛选(VIP/standard)
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: config_list_integrations
  description: 查看所有系统集成配置
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(active/error/degraded)
    required: []
- name: config_get_integration
  description: 获取集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成ID
    required:
    - integration_id
- name: inventory_list_products
  description: 查看库存产品列表
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
    required: []
- name: inventory_get_product
  description: 获取库存产品详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
- name: scheduler_list_jobs
  description: 列出所有定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按最近运行状态筛选(success/failed)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情（含执行历史）
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: scheduler_job_history
  description: 查看定时任务执行历史
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
      limit:
        type: integer
        description: 返回条数
        default: 10
    required:
    - job_id
tool_endpoints:
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
- tool_name: inventory_list_products
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_product
  url: http://localhost:9108/inventory/products/get
  method: POST
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: scheduler_job_history
  url: http://localhost:9112/scheduler/jobs/history
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
