task_id: T161zh_automation_failure_recovery_plus_4
task_name: 消息队列重放风暴后的任务恢复
version: '1.0'
category: ops
difficulty: hard
tags:
- general
- multi_service
services:
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_4/fixtures/scheduler/jobs.json
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_4/fixtures/config/integrations.json
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_4/fixtures/helpdesk/tickets.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_4/fixtures/kb/articles.json
- name: inventory
  command: python mock_services/inventory/server.py
  port: 9108
  health_check: http://localhost:9108/inventory/products
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9108/inventory/reset
  env:
    INVENTORY_FIXTURES: create_query/output_20260522_152922/generated/T161zh_automation_failure_recovery_plus_4/fixtures/inventory/items.json
prompt:
  text: '系统经历消息队列重放风暴后，多项自动化任务连续失败。部分用户反馈库存/订单状态异常，且已存在工单。请你排查并给出恢复方案：


    1）找出失败的定时任务与依赖关系，构建链路范围（事件消费者A→库存汇总→对账/结算同步），并明确哪些任务被“不可信停止/未恢复”影响。

    2）检查相关API集成配置，重点定位消息重放与幂等/重放控制相关的根因（例如幂等键规则字段会随重放变化，导致幂等锁无法命中、触发重复写入保护异常），而不是外部端点不可用。

    3）评估库存数据与订单状态可能受到的影响：识别哪些产品处于 partial/error 或 last_sync 不稳定，解释“汇总依赖流水、流水写入失败→汇总缺失/未更新→对账/结算同步停止”的链路原因，并指出重复写入风险。

    4）关联工单并归因：至少4条工单需覆盖到对应链路阶段；区分“重复风险”与“链路中断”；排除与本次事件无关的硬件工单，不要强行关联。

    5）在知识库中检索并引用恢复要点（给出具体操作步骤与验证方法）。

    6）输出故障分析与具体恢复计划，包含按顺序的恢复步骤、重跑策略、验证清单，以及防止再次重放的措施（停放/限流/死信处理/幂等键修复/监控指标等）。


    注意：恢复过程中不要直接关闭工单；如需更新工单建议标注“处理中/需等待重放停止后验证”。'
  language: zh
tools:
- name: scheduler_list_jobs
  description: 列出定时任务
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(all/enabled/disabled)
      tag:
        type: string
        description: 按标签筛选
    required: []
- name: scheduler_get_job
  description: 获取定时任务详情（含执行历史和依赖关系）
  input_schema:
    type: object
    properties:
      job_id:
        type: string
        description: 任务ID
    required:
    - job_id
- name: config_list_integrations
  description: 列出API集成配置
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 按状态筛选(active/inactive/all)
    required: []
- name: config_get_integration
  description: 获取API集成配置详情
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
        description: 集成配置ID
    required:
    - integration_id
- name: inventory_list_products
  description: 列出库存产品
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: 按分类筛选
    required: []
- name: inventory_get_product
  description: 获取产品库存详情
  input_schema:
    type: object
    properties:
      product_id:
        type: string
        description: 产品ID
    required:
    - product_id
- name: helpdesk_list_tickets
  description: 列出工单
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 工单状态筛选(open/all)
        default: open
    required: []
- name: helpdesk_get_ticket
  description: 获取工单详情
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: 更新工单（优先级、标签、分类）
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      priority:
        type: string
        description: 优先级
      tags:
        type: array
        items:
          type: string
        description: 标签列表
      category:
        type: string
        description: 工单分类
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: 关闭工单
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: 工单ID
      resolution:
        type: string
        description: 解决说明
    required:
    - ticket_id
    - resolution
- name: kb_search
  description: 搜索知识库文章
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词
      category:
        type: string
        description: 按分类筛选
      max_results:
        type: integer
        description: 最大返回数量
        default: 5
    required:
    - query
- name: kb_get_article
  description: 获取知识库文章全文
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
tool_endpoints:
- tool_name: scheduler_list_jobs
  url: http://localhost:9112/scheduler/jobs
  method: POST
- tool_name: scheduler_get_job
  url: http://localhost:9112/scheduler/jobs/get
  method: POST
- tool_name: config_list_integrations
  url: http://localhost:9111/config/integrations
  method: POST
- tool_name: config_get_integration
  url: http://localhost:9111/config/integrations/get
  method: POST
- tool_name: inventory_list_products
  url: http://localhost:9108/inventory/products
  method: POST
- tool_name: inventory_get_product
  url: http://localhost:9108/inventory/products/get
  method: POST
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: helpdesk_close_ticket
  url: http://localhost:9107/helpdesk/tickets/close
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
