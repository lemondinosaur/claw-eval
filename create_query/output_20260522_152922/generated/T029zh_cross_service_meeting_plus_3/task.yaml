task_id: T029zh_cross_service_meeting_plus_3
task_name: 跨时区线上会（夜间边界）
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
  env:
    GMAIL_FIXTURES: create_query/output_20260522_152922/generated/T029zh_cross_service_meeting_plus_3/fixtures/gmail/inbox.json
- name: contacts
  command: python mock_services/contacts/server.py
  port: 9103
  health_check: http://localhost:9103/contacts/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9103/contacts/reset
  env:
    CONTACTS_FIXTURES: create_query/output_20260522_152922/generated/T029zh_cross_service_meeting_plus_3/fixtures/contacts/contacts.json
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: create_query/output_20260522_152922/generated/T029zh_cross_service_meeting_plus_3/fixtures/calendar/events.json
prompt:
  text: '请协助协调来自“GreenWave Partners”的线上会议邀请，并完成跨时区时间换算与日程安排。


    你的任务：

    1）阅读收件箱中的会议邀请邮件，确认会议主题为“增长实验评审”，会议时长为2小时；邮件中给出的是纽约时间（UTC-5）的可选窗口：周一 15:00-19:00（连续2小时，需完全落在该窗口内）。

    2）在通讯录中找到我方三位参会人：沈烨、蒋莉、孙凯（仅邮件给出姓名线索），获取他们的邮箱。

    3）将对方纽约时间窗口换算到北京时间（UTC+8），确定对应的北京时间日期/时间范围（可能跨天）。

    4）在换算后的北京时间日期上查询这三人的日程，计算共同可用且满足“完全落在换算窗口内”的最早连续2小时，并处理边界冲突。

    5）创建日历事件：地点为“WebEx线上”，标题为“增长实验评审”。

    6）给发起方回复并发送确认邮件：邮件正文需写明按北京时间给出的会议开始/结束时间、主题与参会人姓名及邮箱，并说明该时间是由纽约窗口（UTC-5→UTC+8）换算得到。


    注意：请确保所选会议时段是最早可行的2小时，且不与任一人的现有日程冲突。'
  language: zh
tools:
- name: gmail_list_messages
  description: 获取收件箱中的邮件列表
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: 获取最近几天的邮件
        default: 7
      max_results:
        type: integer
        description: 最大返回数量
        default: 20
    required: []
- name: gmail_get_message
  description: 根据邮件ID获取邮件详细内容
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        description: 邮件ID
    required:
    - message_id
- name: gmail_save_draft
  description: 将邮件保存为草稿
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
      reply_to_message_id:
        type: string
        description: 如果是回复邮件，原邮件ID
    required:
    - to
    - subject
    - body
- name: gmail_send_message
  description: 发送邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
        description: 收件人邮箱地址
      subject:
        type: string
        description: 邮件主题
      body:
        type: string
        description: 邮件正文
    required:
    - to
    - subject
    - body
- name: contacts_search
  description: 搜索通讯录中的联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 搜索关键词（姓名、部门等）
      department:
        type: string
        description: 按部门筛选
    required:
    - query
- name: contacts_get
  description: 获取联系人详细信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
        description: 联系人ID
    required:
    - contact_id
- name: calendar_list_events
  description: 获取指定日期范围内的日历事件
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      days:
        type: integer
        description: 查看几天的日程
        default: 1
    required:
    - date
- name: calendar_get_user_events
  description: 获取指定用户在指定日期的日程
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: 用户邮箱
      date:
        type: string
        description: 日期 (YYYY-MM-DD)
    required:
    - user
    - date
- name: calendar_create_event
  description: 创建新的日历事件
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 事件标题
      start_time:
        type: string
        description: 开始时间 (ISO 8601)
      end_time:
        type: string
        description: 结束时间 (ISO 8601)
      attendees:
        type: array
        items:
          type: string
        description: 参会人邮箱列表
      location:
        type: string
        description: 会议地点
    required:
    - title
    - start_time
    - end_time
    - attendees
- name: calendar_delete_event
  description: 删除日历事件
  input_schema:
    type: object
    properties:
      event_id:
        type: string
        description: 事件ID
    required:
    - event_id
tool_endpoints:
- tool_name: gmail_list_messages
  url: http://localhost:9100/gmail/messages
  method: POST
- tool_name: gmail_get_message
  url: http://localhost:9100/gmail/messages/get
  method: POST
- tool_name: gmail_save_draft
  url: http://localhost:9100/gmail/drafts/save
  method: POST
- tool_name: gmail_send_message
  url: http://localhost:9100/gmail/send
  method: POST
- tool_name: contacts_search
  url: http://localhost:9103/contacts/search
  method: POST
- tool_name: contacts_get
  url: http://localhost:9103/contacts/get
  method: POST
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_get_user_events
  url: http://localhost:9101/calendar/user_events
  method: POST
- tool_name: calendar_create_event
  url: http://localhost:9101/calendar/events/create
  method: POST
- tool_name: calendar_delete_event
  url: http://localhost:9101/calendar/events/delete
  method: POST
sandbox_files:
- fixtures/gmail/inbox.json
- fixtures/contacts/contacts.json
- fixtures/calendar/events.json
environment:
  mock_today: '2026-03-03'
  timeout_seconds: 600
  max_turns: 30
