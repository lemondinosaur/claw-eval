task_id: T143zh_quarterly_business_insight_plus_1
task_name: Q2续约与回款风险雷达
version: '1.0'
category: workflow
difficulty: medium
tags:
- general
- multi_service
services:
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T143zh_quarterly_business_insight_plus_1/fixtures/finance/transactions.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: create_query/output_20260522_152922/generated/T143zh_quarterly_business_insight_plus_1/fixtures/crm/customers.json
- name: rss
  command: python mock_services/rss/server.py
  port: 9109
  health_check: http://localhost:9109/rss/feeds
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9109/rss/reset
  env:
    RSS_FIXTURES: create_query/output_20260522_152922/generated/T143zh_quarterly_business_insight_plus_1/fixtures/rss/feeds.json
prompt:
  text: 'Q1已结束，请基于财务交易回款质量、CRM合同状态与行业RSS动态，输出一份“Q2续约与回款风险雷达”。


    要求：

    1）从财务系统拉取Q1交易（按客户汇总），计算每个客户“成功回款金额（completed）”与“失败/退款金额（failed/refunded）”，并给出失败/退款占比，用于判断Q1回款质量趋势。

    2）查看CRM中客户的合同状态与分层信息（如续约谈判、争议处理、降级、到期时间等），识别Q2延期或流失风险客户。

    3）浏览RSS订阅源，提取与各客户行业相关、且与“监管收紧/行业需求波动/成本上升”相关的新闻点。

    4）综合输出：给出Q2最需要优先跟进的Top 3客户（包含：数据证据=回款失败/退款比例与交易异常趋势；CRM证据=合同状态/到期/争议或降级；行业证据=RSS新闻点与归因结论），并说明哪些客户更可能按计划续约。

    5）给出一份可落地的跟进清单（包含跟进频率与沟通重点），确保动作与上述证据能对应落地。'
  language: zh
tools:
- name: finance_list_transactions
  description: 查看交易记录
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 起始日期(YYYY-MM-DD)
      end_date:
        type: string
        description: 截止日期(YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
- name: crm_list_customers
  description: 列出客户
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 客户状态筛选
      tier:
        type: string
        description: 客户等级筛选
    required: []
- name: crm_get_customer
  description: 获取客户详情
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: 客户ID
    required:
    - customer_id
- name: rss_list_feeds
  description: 列出RSS订阅源
  input_schema:
    type: object
    properties: {}
    required: []
- name: rss_get_feed
  description: 获取RSS源文章列表
  input_schema:
    type: object
    properties:
      feed_id:
        type: string
        description: 订阅源ID
    required:
    - feed_id
- name: rss_get_article
  description: 获取文章详情
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: 文章ID
    required:
    - article_id
tool_endpoints:
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
- tool_name: crm_list_customers
  url: http://localhost:9110/crm/customers
  method: POST
- tool_name: crm_get_customer
  url: http://localhost:9110/crm/customers/get
  method: POST
- tool_name: rss_list_feeds
  url: http://localhost:9109/rss/feeds
  method: POST
- tool_name: rss_get_feed
  url: http://localhost:9109/rss/feeds/get
  method: POST
- tool_name: rss_get_article
  url: http://localhost:9109/rss/articles/get
  method: POST
environment:
  timeout_seconds: 600
  max_turns: 30
