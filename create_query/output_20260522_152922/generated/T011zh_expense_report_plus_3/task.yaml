task_id: T011zh_expense_report_plus_3
task_name: 跨月截止的5月结转
version: '1.0'
category: finance
difficulty: easy
tags:
- general
services:
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: create_query/output_20260522_152922/generated/T011zh_expense_report_plus_3/fixtures/finance/transactions.json
prompt:
  text: 帮我整理提交2026年5月的报销。对跨月的可能错入账请严格按交易字段的date为准筛选：仅统计2026-05-01到2026-05-31发生的费用交易；若5月内存在撤销/撤单退款（amount为负），也要纳入5月汇总；同时识别并剔除5月内的疑似重复交易（同日同金额同商户，但描述中订单号后四位不同）。
  language: zh
tools:
- name: finance_list_transactions
  description: 获取费用交易记录列表
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: 开始日期 (YYYY-MM-DD)
      end_date:
        type: string
        description: 结束日期 (YYYY-MM-DD)
    required: []
- name: finance_get_transaction
  description: 获取单笔交易详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: 交易ID
    required:
    - transaction_id
- name: finance_submit_report
  description: 提交费用报告
  input_schema:
    type: object
    properties:
      title:
        type: string
        description: 报告标题
      transactions:
        type: array
        items:
          type: string
        description: 包含的交易ID列表
      total_amount:
        type: number
        description: 总金额
    required:
    - title
    - transactions
    - total_amount
tool_endpoints:
- tool_name: finance_list_transactions
  url: http://localhost:9104/finance/transactions
  method: POST
- tool_name: finance_get_transaction
  url: http://localhost:9104/finance/transactions/get
  method: POST
- tool_name: finance_submit_report
  url: http://localhost:9104/finance/report/submit
  method: POST
sandbox_files:
- fixtures/finance/transactions.json
environment:
  timeout_seconds: 300
  max_turns: 20
