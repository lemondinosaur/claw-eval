task_id: T088_pinbench_project_bootstrap_plan_plus_5
task_name: Data Pipeline Template (Python ETL)
version: '1.0'
category: file_ops
difficulty: easy
tags:
- general
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: create_query/output_20260522_152922/generated/T088_pinbench_project_bootstrap_plan_plus_5/fixtures/todo/tasks.json
prompt:
  text: 'Use the todo service to bootstrap a Python ETL data pipeline template plan
    for "streammason".


    Create actionable tasks for:

    1) creating the project directory layout (including data/ and configs/ folders
    as placeholders),

    2) adding a core ETL function interface with type hints and docstring placeholders,

    3) writing tests that use mocked input data and cover an exception path when input
    data is empty (empty input -> custom exception) and a normal path (valid input
    -> returns a structured result),

    4) writing pyproject metadata and a sample configuration file,

    5) writing a README with how to run the pipeline and explain the folder structure.


    Then summarize the setup plan in the order: directory layout, ETL interface, tests,
    then metadata/config and README.


    Notes/constraints:

    - The configuration may be provided via config file or environment variables,
    but this task only needs to provide configuration-file examples and parameters
    in function interfaces (do not implement env-var reading).

    - Ensure the created tasks explicitly mention both test paths: “空输入→自定义异常” and
    “正常输入→结构化结果”.'
  language: en
tools:
- name: todo_create_task
  description: Create a new todo task
  input_schema:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      priority:
        type: string
      due_date:
        type: string
    required:
    - title
- name: todo_list_tasks
  description: List todo tasks
  input_schema:
    type: object
    properties:
      status:
        type: string
    required: []
tool_endpoints:
- tool_name: todo_create_task
  url: http://localhost:9102/todo/tasks/create
  method: POST
- tool_name: todo_list_tasks
  url: http://localhost:9102/todo/tasks
  method: POST
sandbox_files:
- fixtures/todo/tasks.json
environment:
  timeout_seconds: 180
  max_turns: 10
